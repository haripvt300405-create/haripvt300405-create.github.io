<title>Power BI Generator</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: sticky glass header with a six-step rail; one working column up to 1440px; glass panels on a dark green grid with a mint glow (single dark theme by design). */
:root{
  --bg:#06110D; --surface:#0D1A15; --sunk:#0A1511; --ink:#E9F6EF; --muted:#9DB3A8; --line:#1E382D;
  --brand:#33E6A3; --brand-2:#6FF2C0; --on-brand:#04140D; --accent:#33E6A3;
  --ok:#5FE3A6; --ok-bg:#10301F; --warn:#F2C766; --warn-bg:#352A10; --bad:#FF8B80; --bad-bg:#3A1A18;
  --hl:#FFE14D; --hl-ink:#1A1A1A; --glow:0 0 0 1px rgba(51,230,163,.10),0 10px 40px rgba(0,0,0,.45);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 32px rgba(0,0,0,.35);
  --f-body:'IBM Plex Sans',system-ui,'Segoe UI',Arial,sans-serif;
  --f-head:'Manrope','IBM Plex Sans','Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:radial-gradient(1100px 520px at 78% -8%,rgba(51,230,163,.20),transparent 62%),radial-gradient(900px 600px at -10% 110%,rgba(51,230,163,.08),transparent 60%),linear-gradient(rgba(51,230,163,.045) 1px,transparent 1px) 0 0/72px 72px,linear-gradient(90deg,rgba(51,230,163,.045) 1px,transparent 1px) 0 0/72px 72px,var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#06110D}
h1,h2,h3{font-family:var(--f-head);font-weight:800;letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:26px} h3{font-size:20px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(6,17,13,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-head);font-weight:800;font-size:25px;color:var(--ink);letter-spacing:-.02em}
.brand b::first-letter{color:var(--brand)}
.brand span{font-size:14px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.proj{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.proj label{font-size:14px;color:var(--muted);font-weight:600}
.proj input{width:210px}
.proj input.ver{width:80px}
.rail{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding-block:0 12px}
.rail button{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(13,26,21,.7);color:var(--ink);cursor:pointer;text-align:left;font-weight:600;font-size:16px}
.rail button .n{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--surface);border:2px solid var(--line);font-family:var(--f-mono);font-size:15px}
.rail button.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand);box-shadow:0 0 24px rgba(51,230,163,.35)}
.rail button.on .n{border-color:var(--on-brand);background:transparent}
.rail button.done .n{border-color:var(--ok);color:var(--ok)}
.rail button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{padding-block:22px 80px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.cols{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:linear-gradient(180deg,rgba(18,36,29,.86),rgba(11,22,18,.86));border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--glow);min-width:0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.panel-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:14px}
.lead{color:var(--muted);margin:4px 0 0;max-width:75ch}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:9px 16px;border:1px solid #2A4A3C;border-radius:10px;background:rgba(17,34,27,.9);color:var(--ink);font-weight:600;font-size:16px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-2)}
.btn.primary{box-shadow:0 0 22px rgba(51,230,163,.28)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.small{min-height:36px;padding:5px 11px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],select,textarea{min-height:42px;padding:8px 10px;border:1px solid #2A4A3C;border-radius:8px;background:#0A1611;color:var(--ink);font-size:16px;max-width:100%}
textarea{width:100%;resize:vertical}
textarea.mono,.mono{font-family:var(--f-mono);font-size:15px}
input[type=color]{width:52px;height:42px;padding:2px;border:1px solid var(--line);border-radius:7px;background:var(--surface);cursor:pointer}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--brand)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.drop{display:block;margin-top:14px;border:2px dashed var(--line);border-radius:10px;padding:28px;text-align:center;background:var(--sunk);cursor:pointer}
.drop.over{border-color:var(--brand);background:var(--surface)}
.drop b{font-size:20px;display:block}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.t{border-collapse:collapse;width:100%;font-size:16px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{background:var(--sunk);font-size:14px;color:var(--muted);letter-spacing:.03em;position:sticky;top:0}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.note{padding:12px 16px;border-radius:8px;background:var(--sunk);border:1px solid var(--line)}
.note.warn{background:var(--warn-bg);border-color:transparent;color:var(--ink)}
.note.ok{background:var(--ok-bg);border-color:transparent}
.err{color:var(--bad);font-size:15px;font-weight:600}
.val{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
mark.hl{background:var(--hl);color:var(--hl-ink);padding:1px 6px;border-radius:4px;font-weight:700;animation:blink 1.4s ease-in-out 3}
@keyframes blink{50%{box-shadow:0 0 0 4px var(--hl)}}
@media (prefers-reduced-motion:reduce){mark.hl{animation:none}}
.steps{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:10px}
.steps li{padding-left:4px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:none;background:none;padding:12px 16px;font-weight:600;font-size:16px;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted)}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.toast{border:1px solid var(--brand);position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;background:#0F241B;color:var(--ink);padding:12px 20px;border-radius:8px;font-weight:600;max-width:min(90vw,640px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);color:#1A0705;border-color:var(--bad)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:44px;height:44px;border-radius:8px;border:2px solid var(--line);cursor:pointer}
.sw.on{outline:3px solid var(--accent);outline-offset:2px}
.palgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.palgrid label{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.chartlist{display:flex;flex-direction:column;gap:12px}
.chartitem{border:1px solid var(--line);border-radius:10px;background:var(--sunk)}
.chartitem>summary{list-style:none;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;font-weight:600}
.chartitem>summary::-webkit-details-marker{display:none}
.chartitem[open]>summary{border-bottom:1px solid var(--line)}
.chartbody{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;padding:14px}
.chartbody .form{display:grid;gap:10px}
.chartbody .form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview svg,.dash svg{width:100%;height:auto;display:block}
.dash{border-radius:12px;padding:18px;border:1px solid var(--line)}
.dash-title{font-family:var(--f-head);font-size:28px;font-weight:700;margin:0 0 4px}
.dash-sub{font-size:15px;margin:0 0 14px;opacity:.75}
.slicers{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
details.slicer{position:relative}
details.slicer>summary{list-style:none;cursor:pointer;padding:8px 14px;border-radius:8px;font-weight:600;font-size:15px;border:1px solid rgba(0,0,0,.15);min-height:42px;display:flex;align-items:center;gap:8px}
details.slicer>summary::-webkit-details-marker{display:none}
details.slicer .pop{position:absolute;z-index:15;top:calc(100% + 6px);left:0;min-width:240px;max-height:320px;overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
details.slicer .pop label{display:flex;gap:10px;align-items:center;padding:6px 4px;font-size:16px}
.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.dpanel{position:relative;border-radius:10px;min-width:0;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dtools{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;padding:8px 8px 0}
.dtools button{min-height:32px;padding:3px 10px;font-size:13px;font-weight:700;border-radius:6px;border:1px solid rgba(0,0,0,.18);background:rgba(255,255,255,.85);color:#14202B;cursor:pointer}
.mini{overflow:hidden;border:1px solid var(--line);border-radius:10px}
.mini .dash{zoom:.42;border:none}
.diagram{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0}
.report{max-width:1000px}
.report h2{margin-top:26px;margin-bottom:10px;color:var(--brand)}
.report h1{font-size:32px;color:var(--brand);margin-bottom:6px}
.report p{max-width:80ch}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:none}
.check .ic{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px}
.check .ic.ok{background:var(--ok-bg);color:var(--ok)} .check .ic.warn{background:var(--warn-bg);color:var(--warn)} .check .ic.bad{background:var(--bad-bg);color:var(--bad)}
.helpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px 18px;font-size:15px}
.helpgrid code{font-family:var(--f-mono);font-size:14px;color:var(--brand)}
.hidden{display:none!important}
.pgwrap{position:relative;width:100%;overflow:hidden;border-radius:10px;border:1px solid var(--line);background:var(--sunk)}
.pg{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;--inv:1}
.bx{position:absolute;border-radius:10px}
.bx>svg{width:100%;height:100%;display:block}
.bx.full{box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pg.premium .bx.full:not(.k-title){box-shadow:0 0 18px var(--glow-c, rgba(0,0,0,.2))}
.pg.premium .slbox,.pg.premium details.slfill>summary{border:1.5px solid var(--brd-c, rgba(0,0,0,.2))}
.bx.lay{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:3px solid;cursor:move;touch-action:none;user-select:none;font-family:var(--f-head)}
.bx.lay .bl{font-size:28px;font-weight:700}
.bx.lay .bd{font-size:16px;font-family:var(--f-mono);opacity:.8}
.bx.lay.locked{cursor:default}
.k-title.lay{background:#E6EAEE;border-color:#7A8896;color:#46535F}
.k-kpi.lay{background:#DCE8F5;border-color:#1F4E79;color:#1F4E79}
.k-chart.lay{background:#DDF0EE;border-color:#2E8B8B;color:#1C6262}
.k-slicer.lay{background:#FBE9DC;border-color:#C95F22;color:#8E3F0F}
.bx.lay.sel{outline:6px solid #FFB800;outline-offset:2px;z-index:3}
.bx.lay.ov{border-color:#C0392B!important;border-style:dashed;z-index:2}
.rz{position:absolute;right:0;bottom:0;width:34px;height:34px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,currentColor 50%);border-bottom-right-radius:7px}
.bx.empty{border:3px dashed rgba(90,105,120,.6);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.4)}
.emp{text-align:center;color:#4F6071;display:flex;flex-direction:column;gap:2px}
.emp b{font-size:22px}
.emp span{font-size:16px}
.bx.target{outline:6px dashed #FFB800;outline-offset:2px;cursor:pointer;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{outline-color:rgba(255,184,0,.25)}}
@media (prefers-reduced-motion:reduce){.bx.target{animation:none}}
.bx.sel:not(.lay){outline:6px solid #FFB800;outline-offset:2px;z-index:3}
.pg.place .bx.full{cursor:grab}
.ttl{height:100%;display:flex;align-items:center;gap:18px;padding-left:4px;overflow:hidden;white-space:nowrap}
.ttl b{font-family:var(--f-head);font-size:26px}
.ttl span{font-size:18px;opacity:.7}
.slbox,details.slfill>summary{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px;padding:6px 12px;border-radius:10px;border:1px solid rgba(0,0,0,.12)}
.slbox span,.sl-l{font-size:12px;font-weight:600;opacity:.7}
.slbox b,.sl-v{font-size:16px}
details.slfill{position:absolute;inset:0}
details.slfill>summary{min-height:0}
details.slfill .pop{font-size:calc(16px * var(--inv));min-width:calc(240px * var(--inv));max-height:560px}
details.slfill .pop input[type=checkbox]{width:calc(20px * var(--inv));height:calc(20px * var(--inv))}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tpl{display:flex;flex-direction:column;gap:6px;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;font-weight:600;font-size:15px}
.tpl:hover{border-color:var(--brand)}
.tpl.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.tpl[disabled]{opacity:.55;cursor:not-allowed}
.tpl svg{border-radius:6px;border:1px solid var(--line)}
.hd{position:absolute;inset:0}
.hd>*{position:absolute;top:6px;bottom:6px;display:flex;align-items:center}
.hd-logo{overflow:hidden}
.hd-logo img{width:100%;height:100%;object-fit:contain;object-position:left center}
.hd-logo span{border:2px dashed;border-radius:6px;padding:4px 14px;font-weight:700;font-size:14px;opacity:.7}
.hd-tab{background:none;border:none;font:600 18px var(--f-head);cursor:pointer;justify-content:center;white-space:nowrap;overflow:hidden;opacity:.5;padding:0 8px}
.hd-tab.on{opacity:1;font-weight:800}
.hd-tab:hover{opacity:.85}
.hd-title{font:800 26px var(--f-head);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-date,.hd-ref{border:1px solid rgba(0,0,0,.15);border-radius:8px;gap:6px;padding:0 10px;font:600 14px var(--f-body)}
.hd-date input{font:600 13px var(--f-body);border:none;background:transparent;color:inherit;min-height:0;padding:0;width:128px}
.hd-ref{cursor:pointer;justify-content:center}
.bx.lay .bi{font-size:17px;font-family:var(--f-body);font-weight:600;max-width:92%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plansheet{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#FBFBF8}
.plansheet svg{display:block;width:100%;min-width:900px;height:auto}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 46px 104px auto;gap:8px;align-items:center;padding:3px 0}
.crow .cl{font-weight:600;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .cl small{font-weight:400;color:var(--muted);font-size:12px}
.crow input[type=color]{width:46px;height:38px}
.hex{font-family:var(--f-mono)!important;font-size:15px!important;width:104px;min-height:38px!important;text-transform:uppercase}
.palgrid .crow{grid-template-columns:minmax(0,1fr) 46px 104px}
.cpanel{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.csec{margin:12px 0 4px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.gengrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tpl.gen{gap:8px;padding:10px}

.tpl.gen ul{margin:0;padding-left:18px;font-weight:400;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.ai-fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:45;background:var(--brand);color:var(--on-brand);border:none;border-radius:999px;padding:14px 22px;font:800 17px var(--f-head);box-shadow:0 0 32px rgba(51,230,163,.45);cursor:pointer}
.ai-fab:hover{background:var(--brand-2)}
.ai-drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100vw);z-index:46;background:rgba(7,18,14,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:-20px 0 60px rgba(0,0,0,.5)}
.ai-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ai-head b{display:block;font:800 19px var(--f-head);color:var(--brand)}
.ai-head span{font-size:13px;color:var(--muted)}
.ai-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];

function guid(){

}

const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
const safeFile = s => String(s||'').replace(/[^A-Za-z0-9 _-]/g,'').trim().replace(/\s+/g,'_') || 'Project';
const trunc = (s, n) => { s = String(s); return s.length > n ? s.slice(0, Math.max(1, n-1)) + '…' : s; };
function toast(msg, kind){

  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3800);
}
function logStep(msg){ S.log.push({t: new Date().toISOString(), msg}); if (S.log.length > 400) S.log.shift(); }
function debounce(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function nowStamp(){ const d = new Date(); return d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }

/* ---------------- colour helpers ---------------- */
function hexToRgb(h){ h = String(h).replace('#',''); if (h.length===3) h = h.split('').map(c=>c+c).join(''); const n = parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; }
function rgbToHex(r,g,b){ return '#' + [r,g,b].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('').toUpperCase(); }
function mix(a, b, t){ const A = hexToRgb(a), B = hexToRgb(b); return rgbToHex(A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t); }
function lum(h){ const [r,g,b] = hexToRgb(h).map(v => { v/=255; return v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); }); return .2126*r + .7152*g + .0722*b; }
function contrast(a,b){ const x = lum(a), y = lum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); }
function seriesColors(pal){
  return [pal.primary, pal.secondary, pal.accent, ...(pal.extra || []), mix(pal.primary,'#FFFFFF',.4), mix(pal.secondary,'#FFFFFF',.4), mix(pal.accent,'#FFFFFF',.4), mix(pal.primary,'#000000',.3), mix(pal.secondary,'#000000',.3), mix(pal.accent,'#000000',.3), mix(pal.primary,pal.accent,.5)];
}

/* ---------------- state ---------------- */
function freshState(){
  return {
    project:{name:'Sales Dashboard', version:'v1', title:'Sales Performance Dashboard', numberStyle:'intl', currency:'', dataFolder:'', planNo:'DLP-001', projectNo:'', drawnBy:'', checkedBy:'', approvedBy:'', logo:'', problem:'', objective:'', recs:'', outcome:''},
    tables:[], rels:[], measures:[], reqText:'', reqs:[], charts:[], slicers:[], sel:{},
    palette:{...DEFAULT_PALETTE}, refImage:null, refColors:[], pickedColor:null, compare:false,
    log:[], step:1, customized:false, isSample:false, reportTab:'report', analyzed:false,
    pages:[], curPage:0, designTab:'pages', slicerMode:'sync', pageSel:{}, placing:null, selBox:null,
    header:{logo:true, tabs:true, title:true, date:true}, look:'premium', dateRanges:{}, codeColors:[], codeText:''
  };
}
let S = freshState();
const RAW = {};            // original file bytes by file name (kept in memory only)
const UI = {openChart:null, openTable:{}, showRows:{}};

/* ---------------- file parsing ---------------- */
function decodeText(buf){
  let t = new TextDecoder('utf-8').decode(buf);
  if (t.includes('\uFFFD')) { try { t = new TextDecoder('windows-1252').decode(buf); } catch(e){} }
  return t.replace(/^\uFEFF/, '');
}
function detectDelimiter(text){
  const first = text.split(/\r?\n/).find(l => l.trim()) || '';
  let best = ',', bestN = 0;
  for (const d of [',',';','\t','|']) { const n = first.split(d).length; if (n > bestN) { best = d; bestN = n; } }
  return best;
}
function parseCSV(text, delim){
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else q = false; }
      else field += c;
    } else {
      if (c === '"' && field === '') q = true;
      else if (c === delim){ row.push(field); field = ''; }
      else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i+1] === '\n') i++; row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if (field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim() !== ''));
}
function jsonToMatrix(js){
  let arr = js, nested = false;
  if (!Array.isArray(arr)){ const k = Object.keys(js||{}).find(k => Array.isArray(js[k])); if (!k) throw new Error('No list of records found in the JSON file'); arr = js[k]; nested = true; }
  const flat = arr.map(o => { const r = {}; for (const [k,v] of Object.entries(o||{})){ if (v && typeof v === 'object' && !Array.isArray(v)){ nested = true; for (const [k2,v2] of Object.entries(v)) r[k+'.'+k2] = v2; } else r[k] = Array.isArray(v) ? v.join(', ') : v; } return r; });
  const heads = [...new Set(flat.flatMap(o => Object.keys(o)))];
  return {matrix:[heads, ...flat.map(o => heads.map(h => o[h] ?? ''))], nested};
}
function parseNum(v){
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).trim(); if (!s) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)){ neg = true; s = s.slice(1,-1); }
  s = s.replace(/[₹$€£\s]/g,'').replace(/^(Rs\.?|INR)/i,'');
  if (!/^[-+]?(\d{1,3}(,\d{2,3})*|\d+)(\.\d+)?%?$/.test(s) && !/^[-+]?\.\d+%?$/.test(s)) return null;
  const pct = s.endsWith('%'); s = s.replace(/[,%]/g,'');
  let n = parseFloat(s); if (isNaN(n)) return null;
  if (neg) n = -n;
  return pct ? n/100 : n;
}
const isDate = v => Object.prototype.toString.call(v) === '[object Date]' && !isNaN(v.getTime());
const MONTHS = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
const pad2 = n => String(n).padStart(2,'0');
function validYMD(y,m,d){ if (m<1||m>12||d<1) return false; return d <= new Date(y, m, 0).getDate(); }
function isoOf(y,m,d){ return validYMD(y,m,d) ? `${y}-${pad2(m)}-${pad2(d)}` : null; }
function dateToIso(d){ const t = new Date(Math.round(d.getTime()/3.6e6)*3.6e6); return isoOf(t.getFullYear(), t.getMonth()+1, t.getDate()); }
function parseDateStr(s, order){
  s = String(s).trim(); let m;
  if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(?:[ T].*)?$/))) return isoOf(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2}|\d{4})(?:[ T].*)?$/))){
    let a = +m[1], b = +m[2], y = +m[3]; if (y < 100) y += 2000;
    return order === 'mdy' ? isoOf(y, a, b) : isoOf(y, b, a);
  }
  if ((m = s.match(/^(\d{1,2})[-\s\/]([A-Za-z]{3,9})[-\s\/,]+(\d{2}|\d{4})$/))){ const mo = MONTHS[m[2].slice(0,4).toLowerCase()] || MONTHS[m[2].slice(0,3).toLowerCase()]; let y = +m[3]; if (y<100) y += 2000; return mo ? isoOf(y, mo, +m[1]) : null; }
  if ((m = s.match(/^([A-Za-z]{3,9})\s+(\d{1,2}),?\s+(\d{4})$/))){ const mo = MONTHS[m[1].slice(0,3).toLowerCase()]; return mo ? isoOf(+m[3], mo, +m[2]) : null; }
  return null;
}
function dateOrderFor(vals){
  let dmy = 0, mdy = 0;
  for (const v of vals){ const m = String(v).trim().match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2}|\d{4})/); if (!m) continue; if (+m[1] > 12) dmy++; if (+m[2] > 12) mdy++; }
  return (mdy > 0 && dmy === 0) ? 'mdy' : 'dmy';
}
function detectColumn(name, vals){
  const ne = vals.filter(v => v !== null && v !== undefined && String(v).trim() !== '');
  const res = {type:'text', role:'dimension', order:null, isInt:false, iso:false};
  if (!ne.length) return res;
  const order = dateOrderFor(ne);
  let nNum = 0, nDate = 0, allInt = true, nIso = 0;
  for (const v of ne){
    if (isDate(v)){ nDate++; continue; }
    const n = parseNum(v);
    if (n !== null){ nNum++; if (!Number.isInteger(n)) allInt = false; }
    else if (parseDateStr(v, order)){ nDate++; if (/^\d{4}-/.test(String(v).trim())) nIso++; }
  }
  const N = ne.length, idLike = /(^|[\s_\-.])(id|code|key|no|num|number|pin|pincode|zip|sku)$/i.test(name) || /[a-z]ID$/.test(name) || /^id$/i.test(name);
  if (nDate >= Math.max(1, N*0.9)){ res.type = 'date'; res.role = 'date'; res.order = order; res.iso = nIso === nDate; return res; }
  if (nNum >= N*0.95){ res.type = 'number'; res.isInt = allInt; res.role = idLike ? 'key' : (/(^|[\s_\-])(year|yr|month|week|quarter|day|hour|period)$/i.test(name) || /^(year|yr|month|week|quarter)$/i.test(name) ? 'dimension' : 'measure'); return res; }
  res.role = idLike ? 'key' : 'dimension';
  return res;
}
function convertValue(v, col){
  if (v === null || v === undefined || String(v).trim() === '') return null;
  if (col.type === 'number'){ return parseNum(isDate(v) ? NaN : v); }
  if (col.type === 'date'){ if (isDate(v)) return dateToIso(v); if (typeof v === 'number' && v > 20000 && v < 80000) return dateToIso(new Date(Math.round((v - 25569) * 864e5) + new Date().getTimezoneOffset()*6e4)); return parseDateStr(v, col.order || 'dmy'); }
  if (isDate(v)) return dateToIso(v);
  return String(v).trim();
}
function cleanName(s){ return String(s||'').replace(/[^\w\s\-]/g,' ').replace(/\s+/g,' ').trim() || 'Table'; }
function uniqueTableName(n){ let name = n, i = 2; while (S.tables.some(t => t.name.toLowerCase() === name.toLowerCase()) || ['date','calendar'].includes(name.toLowerCase())) name = `${n} ${i++}`; return name; }
function buildTable(name, file, ext, sheet, matrix, extra={}){
  const rawHeads = matrix[0].map((h,i) => String(h ?? '').trim() || `Column${i+1}`);
  const seen = {}; const heads = rawHeads.map(h => { const k = h.toLowerCase(); if (seen[k]){ seen[k]++; return `${h}_${seen[k]-1}`; } seen[k] = 1; return h; });
  const body = matrix.slice(1).filter(r => r.some(v => v !== null && v !== undefined && String(v).trim() !== ''));
  const cols = heads.map((h, i) => { const d = detectColumn(h, body.map(r => r[i])); return {name:h, type:d.type, role:d.role, order:d.order, isInt:d.isInt, iso:d.iso}; });
  const raw = body.map(r => heads.map((h,i) => isDate(r[i]) ? r[i] : (r[i] ?? '')));
  const t = {id:uid('t'), name, file, ext, sheet, cols, raw, rows:[], delim:extra.delim||',', nested:!!extra.nested};
  rebuildRows(t);
  return t;
}
function rebuildRows(t){
  if (!t.raw){ // reconstruct raw from current values (after reload)
    t.raw = t.rows.map(r => t.cols.map(c => r[c.name] ?? ''));
  }
  t.rows = t.raw.map(r => { const o = {}; t.cols.forEach((c,i) => o[c.name] = convertValue(r[i], c)); return o; });
}
async function handleFiles(list){
  let added = 0;
  if (S.isSample && list.length){ const st = S.step; S = freshState(); S.step = st; Object.keys(RAW).forEach(k => delete RAW[k]); resetCaches(); }
  for (const f of list){
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    try {
      const buf = await f.arrayBuffer();
      const base = f.name.replace(/\.[^.]+$/,'');
      if (['csv','txt','tsv'].includes(ext)){
        const text = decodeText(buf); const delim = ext === 'tsv' ? '\t' : detectDelimiter(text);
        const m = parseCSV(text, delim); if (m.length < 2) throw new Error('The file has no data rows');
        RAW[f.name] = {buf, ext:'csv'};
        S.tables.push(buildTable(uniqueTableName(cleanName(base)), f.name, 'csv', null, m, {delim})); added++;
      } else if (['xlsx','xls','xlsm','xlsb'].includes(ext)){
        const wb = XLSX.read(new Uint8Array(buf), {type:'array', cellDates:true});
        const sheets = wb.SheetNames.map(n => ({n, m:XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:''})})).filter(s => s.m.length > 1);
        if (!sheets.length) throw new Error('No sheet with data rows was found');
        RAW[f.name] = {buf, ext:'xlsx'};
        sheets.forEach(s => { S.tables.push(buildTable(uniqueTableName(cleanName(sheets.length > 1 ? s.n : base)), f.name, 'xlsx', s.n, s.m)); added++; });
      } else if (ext === 'json'){
        const {matrix, nested} = jsonToMatrix(JSON.parse(decodeText(buf)));
        if (matrix.length < 2) throw new Error('The file has no records');
        RAW[f.name] = {buf, ext:'json'};
        S.tables.push(buildTable(uniqueTableName(cleanName(base)), f.name, 'json', null, matrix, {nested})); added++;
      } else { toast(`${f.name}: this file type is not supported. Use CSV, TXT, Excel or JSON.`, 'bad'); continue; }
      logStep(`Loaded file ${f.name}`);
    } catch(e){ toast(`Could not read ${f.name}: ${e.message}`, 'bad'); }
  }
  if (added){ S.isSample = false; if (!S.project.title || S.project.title === DEFAULT_TITLE) S.project.title = autoTitle(); afterDataChange(true); toast(`${added} table${added>1?'s':''} added`); }
}
function afterDataChange(redetect){
  resetCaches();
  if (redetect) detectRelationships();
  mergeSuggestions();
  S.tables.forEach(t => t.cols.forEach(c => { if (c.role === 'measure' && c.type !== 'number') c.role = 'dimension'; }));
  compileAll();
  if (S.reqs.length) remapReqMeasures();
  logStep(`Model refreshed: ${S.tables.length} tables, ${S.rels.length} relationships, ${S.measures.length} measures`);
  saveLocal(); render();
}

function dataPeriod(){

  return mn ? `${grainLabel(mn.slice(0, 7), 'month')} to ${grainLabel(mx.slice(0, 7), 'month')}` : '';
}
function storyDims(){
  const set = [];
  [...S.slicers, ...S.charts.map(c => c.groupBy)].forEach(gb => { if (!gb) return; const g = parseGB(gb); if (!g) return; const lab = g.grain ? 'time' : g.col; if (!set.includes(lab)) set.push(lab); });
  return set;
}

function blocksPDF(B){
  const doc = new jspdf.jsPDF({unit:'pt', format:'a4'}); const PW = doc.internal.pageSize.getWidth(), PH = doc.internal.pageSize.getHeight(), M = 40, TW = PW - 2*M; let y = M;

      const drawHead = () => { doc.setFillColor(...rgb); doc.rect(M, y, TW, 18, 'F'); doc.setFont('helvetica','bold'); doc.setFontSize(fs); doc.setTextColor(255,255,255); let x = M; b.table.head.forEach((h, i) => { doc.text(doc.splitTextToSize(String(h), widths[i]-6)[0], x + 3, y + 12); x += widths[i]; }); y += 18; };
      need(40); drawHead();
      b.table.rows.forEach((r, ri) => { doc.setFont('helvetica','normal'); doc.setFontSize(fs); const cells = r.map((v, i) => doc.splitTextToSize(String(v ?? '').replace(/[^\x00-\xFF]/g,'?'), widths[i]-6)); const h = Math.max(...cells.map(c => c.length))*fs*1.25 + 6;
        if (need(h)) drawHead(); if (ri % 2){ doc.setFillColor(244,246,248); doc.rect(M, y, TW, h, 'F'); } doc.setTextColor(25,32,43); let x = M; cells.forEach((c, i) => { doc.text(c, x + 3, y + fs + 2); x += widths[i]; }); doc.setDrawColor(210,218,226); doc.line(M, y + h, M + TW, y + h); y += h; });
      y += 10;
    }
    else if (b.img){ let w = TW, h = TW * b.img.h / b.img.w; if (h > PH - 2*M){ h = PH - 2*M; w = h * b.img.w / b.img.h; } need(h + 8); doc.addImage(b.img.dataUrl, 'PNG', M, y, w, h); y += h + 10; }

}

/* ---------------- reference image colours ---------------- */
function extractColors(img){
  const c = document.createElement('canvas'), w = 160, h = Math.max(1, Math.round(160*img.height/img.width)); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, w, h); const d = x.getImageData(0, 0, w, h).data; const buckets = new Map();
  for (let i = 0; i < d.length; i += 4){ if (d[i+3] < 200) continue; const k = (d[i]>>4)+','+(d[i+1]>>4)+','+(d[i+2]>>4); const b = buckets.get(k) || {n:0, r:0, g:0, b:0}; b.n++; b.r += d[i]; b.g += d[i+1]; b.b += d[i+2]; buckets.set(k, b); }
  const arr = [...buckets.values()].map(b => ({n:b.n, hex:rgbToHex(b.r/b.n, b.g/b.n, b.b/b.n)})).sort((a, b) => b.n - a.n);
  const picked = []; for (const a of arr){ if (picked.every(p => colorDist(p.hex, a.hex) > 40)) picked.push(a); if (picked.length >= 12) break; }
  return picked.map(p => p.hex);
}
function colorDist(a, b){ const A = hexToRgb(a), B = hexToRgb(b); return Math.sqrt((A[0]-B[0])**2 + (A[1]-B[1])**2 + (A[2]-B[2])**2); }
function autoPaletteFrom(colors){
  if (!colors.length) return;
  const sat = h => { const [r,g,b] = hexToRgb(h).map(v => v/255); const mx = Math.max(r,g,b), mn = Math.min(r,g,b); return mx === 0 ? 0 : (mx - mn)/mx; };
  const page = colors[0]; const dark = lum(page) < 0.25;
  const vivid = colors.filter(c => sat(c) > 0.3 && contrast(c, page) > 1.8);
  const text = [...colors].sort((a, b) => contrast(b, page) - contrast(a, page))[0];
  const card = colors.slice(1).find(c => colorDist(c, page) < 60 && colorDist(c, page) > 6) || (dark ? mix(page, '#FFFFFF', .06) : '#FFFFFF');
  S.palette = {page, card, text: contrast(text, page) > 4 ? text : (dark ? '#F2F5F8' : '#1B2733'), primary: vivid[0] || S.palette.primary, secondary: vivid[1] || S.palette.secondary, accent: vivid[2] || S.palette.accent};
}

  try {

    const prompt = `You write Power BI DAX measures. Use only these functions: SUM, AVERAGE, MIN, MAX, COUNT, DISTINCTCOUNT, COUNTROWS, SUMX, AVERAGEX, DIVIDE, IF, ROUND, ABS, TOTALYTD, CALCULATE with SAMEPERIODLASTYEAR / DATESYTD / DATEADD / ALL / Table[Column] = "value". Reference columns as Table[Column] (quote table names with spaces like 'My Table'[Col]) and existing measures as [Measure Name].

${schema}

  } catch(e){ if (e && e.code === 'not_granted'){ SAMPLE_API = null; render(); } toast(`Could not get suggestions: ${e.message || e.code}`, 'bad'); btn.disabled = false; btn.textContent = 'Suggest measures with Claude'; }
}

function drawDiagram(){

  let changed = true; while (changed){ changed = false; S.rels.forEach(r => { if (depth[r.fromT] !== null && depth[r.fromT] !== undefined && (depth[r.toT] === null || depth[r.toT] > depth[r.fromT] + 1)){ depth[r.toT] = depth[r.fromT] + 1; changed = true; } }); }
  const maxD = Math.max(0, ...Object.values(depth).filter(v => v !== null)); S.tables.forEach(t => { if (depth[t.name] === null) depth[t.name] = maxD + 1; });
  const BW = 250, HH = 38, RH = 26, GX = 110, cols = {}; S.tables.forEach(t => (cols[depth[t.name]] = cols[depth[t.name]] || []).push(t));

  S.rels.forEach(r => { const a = pos[r.fromT], b = pos[r.toT]; if (!a || !b) return; const fwd = a.x < b.x; const x1 = fwd ? a.x + BW : a.x, x2 = fwd ? b.x : b.x + BW, y1 = colY(r.fromT, r.fromC), y2 = colY(r.toT, r.toC); const mx = (x1 + x2)/2;

  S.tables.forEach(t => { const P = pos[t.name];
    svg += `<rect x="${P.x}" y="${P.y}" width="${BW}" height="${P.h}" rx="8" fill="${p.card}" stroke="${p.line}" stroke-width="1.5"/><rect x="${P.x}" y="${P.y}" width="${BW}" height="${HH}" rx="8" fill="${p.brand}"/><rect x="${P.x}" y="${P.y + HH - 8}" width="${BW}" height="8" fill="${p.brand}"/><text x="${P.x + 14}" y="${P.y + 25}" font-size="16" font-weight="700" fill="var(--on-brand)">${esc(trunc(t.name, 20))}${t === fact ? '  · main table' : ''}</text>`;
    t.cols.slice(0, P.shown).forEach((c, i) => { const y = P.y + HH + i*RH + 19; const tag = {measure:'Σ', date:'DATE', key:'KEY', dimension:'', ignore:'—'}[c.role]; svg += `<text x="${P.x + 14}" y="${y}" font-size="14.5" fill="${c.role === 'ignore' ? p.mute : p.ink}">${esc(trunc(c.name, 22))}</text>${tag ? `<text x="${P.x + BW - 12}" y="${y}" font-size="11.5" font-weight="700" text-anchor="end" fill="${p.mute}">${tag}</text>` : ''}`; });
    if (t.cols.length > 12) svg += `<text x="${P.x + 14}" y="${P.y + HH + 12*RH + 19}" font-size="13.5" fill="${p.mute}">+ ${t.cols.length - 12} more columns</text>`; });

  const dl = `<div class="row" style="margin-bottom:14px"><button class="btn primary" data-act="xr" data-w="${tab}" data-k="docx">Download Word</button><button class="btn" data-act="xr" data-w="${tab}" data-k="pdf">Download PDF</button><button class="btn" data-act="xr" data-w="${tab}" data-k="html">Download web page</button></div>`;
  const body = tab === 'report' ? `${reportEditor()}${dl}<div class="report">${blocksHTML(reportBlocks(true))}</div>` : `${dl}<div class="report">${blocksHTML(buildBlocks())}</div>`;
  const list = savedProjects();
  return `<div class="stack"><div class="panel"><div class="panel-head"><div><h2>Step 6 · Reports</h2><p class="lead"><b>Report</b> tells the business story: the problem, the business questions with the answers from the dashboard, the insights and the outcome. <b>Build</b> explains how the dashboard was made: data, model, DAX measures, layout and checks.</p></div></div>
    <div class="tabs" role="tablist">${[['report','Report'],['build','Build']].map(([k, l]) => `<button role="tab" aria-selected="${tab === k}" class="${tab === k ? 'on' : ''}" data-act="rtab" data-k="${k}" style="font-size:18px">${l}</button>`).join('')}</div>${body}</div>
    <details class="panel"><summary style="cursor:pointer;font-weight:700;font-size:18px">Saved projects (${list.length})</summary><div style="margin-top:14px">
      <div class="row" style="margin-bottom:14px"><button class="btn primary" data-act="save-project">Save current project in this browser</button><button class="btn" data-act="dl-project">Download project file (.json)</button><label class="btn" for="projIn">Open project file</label><input type="file" id="projIn" accept=".json" hidden></div>
      <p class="lead" style="margin-bottom:12px">Saved projects stay in this browser only. Use "Download project file" to keep a copy or move it to another computer.</p>
      ${list.length ? `<div class="tablewrap"><table class="t"><thead><tr><th>Project</th><th>Version</th><th>Saved</th><th>Tables</th><th>Charts</th><th></th></tr></thead><tbody>${list.map(p => `<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.version)}</td><td>${new Date(p.savedAt).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</td><td class="num">${p.tables}</td><td class="num">${p.charts}</td><td><div class="row"><button class="btn small" data-act="open-proj" data-id="${p.id}">Open</button>${S.delConfirm === p.id ? `<button class="btn small danger" data-act="del-proj-yes" data-id="${p.id}">Confirm delete</button><button class="btn small" data-act="del-proj-no">Cancel</button>` : `<button class="btn small danger" data-act="del-proj" data-id="${p.id}">Delete</button>`}</div></td></tr>`).join('')}</tbody></table></div>` : '<p>No saved projects yet.</p>'}
    </div></details>${navButtons()}</div>`;
}

function syncReqToChart(r){
  const ch = S.charts.find(c => c.reqId === r.id);
  if (ch){ const wasAuto = ch.title === chartTitle({...r, measures:ch.measures, groupBy:ch.groupBy}); ch.measures = [...r.measures]; ch.groupBy = r.groupBy; ch.type = r.chart; if (wasAuto) ch.title = chartTitle(r); if (ch.type === 'card') ch.indicator = primaryDateCol() ? 'ly' : 'none'; else if (ch.indicator === 'ly') ch.indicator = 'none'; }
  else S.charts.push(chartFromReq(r));
}

async function aiSend(text){
  text = String(text || '').trim(); if (!text || AI.busy) return;
  const prov = aiProvider();
  if (prov === 'claude' && !SAMPLE_API){ toast('Claude is not available here. Choose Gemini in AI settings.', 'bad'); return; }
  if (prov === 'gemini' && !AI.gKey){ AI.setOpen = true; renderAI(); toast('Add your Gemini API key in AI settings first', 'bad'); return; }
  AI.msgs.push({role:'user', text}); AI.turns.push({role:'user', content:text});
  AI.snapshot = serial(); AI.busy = true;
  const bubble = {role:'assistant', text:'Thinking…', pending:true}; AI.msgs.push(bubble); renderAI(); if ($('#aiIn')) $('#aiIn').value = '';
  AI.ctl = new AbortController();
  if (prov === 'gemini'){
    AI.gContents.push({role:'user', parts:[{text}]});
    try { await geminiRun(bubble); }
    catch(e){ bubble.pending = false; if (e && e.code === 'cancelled') bubble.text = (bubble.text === 'Thinking…' ? '' : bubble.text + '\n') + '(Stopped)'; else { bubble.role = 'error'; bubble.text = (e && e.message) || 'Gemini error. Please try again.'; } }
    gemTrim(); AI.busy = false; AI.ctl = null; saveLocal(); renderAI(); return;
  }
  const input = [{role:'user', content:`${aiRules()}\n\nCURRENT APP STATE (JSON):\n${JSON.stringify(aiState()).slice(0, 60000)}`}, ...AI.turns.slice(-14)];
  const opts = {signal:AI.ctl.signal, modelTier:AI.tier, onText:({text}) => { bubble.text = text; bubble.pending = false; renderAIMsgs(); }};
  if (AI.toolsOk) opts.tools = aiTools(); else opts.cache = false;
  try {
    const res = await SAMPLE_API(input, opts);
    bubble.text = res.text + (res.truncated ? '\n(The answer was cut short — ask for less at a time.)' : ''); bubble.pending = false; AI.turns.push({role:'assistant', content:res.text});
  } catch(e){
    bubble.pending = false; const code = e && e.code;
    if (code === 'cancelled') bubble.text = (e.text ? e.text + '\n' : '') + '(Stopped)';
    else if (['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){ bubble.role = 'error'; bubble.text = 'Claude is not allowed for this app in this view, so the assistant is switched off.'; SAMPLE_API = null; }
    else if (code === 'tools_unavailable'){ AI.toolsOk = false; bubble.role = 'error'; bubble.text = 'This view cannot let me change the app. Ask again and I will answer in words only.'; }
    else if (code === 'rate_limited'){ bubble.role = 'error'; bubble.text = 'Too many requests right now. Please wait a minute and try again.'; }
    else if (code === 'refused'){ bubble.role = 'error'; bubble.text = 'I could not help with that request. Please rephrase it.'; }
    else { bubble.role = e && e.text ? 'assistant' : 'error'; bubble.text = (e && e.text ? e.text + '\n\n' : '') + `Something went wrong (${code || 'error'}). Please try again.`; }
    if (bubble.role !== 'error' && e.text) AI.turns.push({role:'assistant', content:e.text});
  }
  AI.busy = false; AI.ctl = null; saveLocal(); renderAI();
}

/* ---------------- Gemini (Google) provider — works in the offline file with the user's own API key ---------------- */
const LS_GKEY = 'pbigen.gemini.key', LS_GMODEL = 'pbigen.gemini.model', LS_PROV = 'pbigen.ai.provider';
function lsGet(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }
function lsSet(k, v){ try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); return true; } catch(e){ return false; } }
AI.gKey = lsGet(LS_GKEY); AI.gModel = lsGet(LS_GMODEL) || 'gemini-2.5-flash'; AI.gModels = []; AI.gContents = []; AI.provider = lsGet(LS_PROV) || (AI.gKey ? 'gemini' : 'auto');
function aiProvider(){ if (AI.provider === 'gemini' || AI.provider === 'claude') return AI.provider; return SAMPLE_API ? 'claude' : 'gemini'; }
function gemErr(status, msg){
  const m = String(msg || '');
  if (status === 400 && /api key/i.test(m)) return 'The Gemini API key is not valid. Check it in AI settings.';
  if (status === 403) return 'Google refused this key (permission denied). Check that the key is active in Google AI Studio.';
  if (status === 404) return `The model "${AI.gModel}" was not found. Click "Test key" in AI settings and choose another model.`;
  if (status === 429) return 'Your Gemini quota is used up for now (free-tier limit). Wait a minute, or turn on billing in Google AI Studio for more.';
  if (status >= 500) return 'Gemini is busy or having a problem. Please try again in a moment.';
  return 'Gemini error: ' + (m || status);
}
async function gemFetch(url, body, signal){
  let res;
  try { res = await fetch(url, body ? {method:'POST', headers:{'Content-Type':'application/json', 'x-goog-api-key':AI.gKey}, body:JSON.stringify(body), signal} : {headers:{'x-goog-api-key':AI.gKey}, signal}); }
  catch(e){ if (e && e.name === 'AbortError') throw {code:'cancelled'}; throw {code:'gemini', message:'Cannot reach Gemini from here. Gemini works in the offline file opened in Chrome or Edge on your computer, with internet on. (The claude.ai page blocks outside connections.)'}; }
  const js = await res.json().catch(() => ({}));
  if (!res.ok) throw {code:'gemini', message:gemErr(res.status, js.error && js.error.message)};
  return js;
}
async function gemTestKey(){
  if (!AI.gKey) return toast('Paste your Gemini API key first', 'bad');
  try {
    const js = await gemFetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200');
    AI.gModels = (js.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent') && /gemini/i.test(m.name) && !/embedding|aqa|image|tts|audio|live/i.test(m.name)).map(m => m.name.replace(/^models\//, ''));
    if (AI.gModels.length && !AI.gModels.includes(AI.gModel)){ AI.gModel = AI.gModels.find(n => /flash/.test(n) && !/lite/.test(n)) || AI.gModels[0]; lsSet(LS_GMODEL, AI.gModel); }
    AI.gStatus = `Key works ✓ — ${AI.gModels.length} models available`; toast('Gemini key works');
  } catch(e){ AI.gStatus = e.message || 'Key test failed'; toast(AI.gStatus, 'bad'); }
  renderAI();
}
function gemSchema(s){ return JSON.parse(JSON.stringify(s)); }
async function geminiRun(bubble){
  const decl = AI_TOOLS_ALL.map(t => ({name:t.name, description:t.description, ...(t.inputSchema ? {parameters:gemSchema(t.inputSchema)} : {})}));
  const C = AI.gContents;
  for (let round = 0; round < 10; round++){
    const body = {systemInstruction:{parts:[{text:`${aiRules()}\n\nCURRENT APP STATE (JSON):\n${JSON.stringify(aiState()).slice(0, 60000)}`}]}, contents:C, tools:[{functionDeclarations:decl}], generationConfig:{temperature:0.2}};
    const js = await gemFetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(AI.gModel)}:generateContent`, body, AI.ctl.signal);
    const cand = js.candidates && js.candidates[0], parts = (cand && cand.content && cand.content.parts) || [];
    if (!parts.length) throw {code:'gemini', message: js.promptFeedback && js.promptFeedback.blockReason ? `Gemini blocked this request (${js.promptFeedback.blockReason}). Please rephrase.` : `Gemini gave no answer${cand && cand.finishReason ? ' (' + cand.finishReason + ')' : ''}. Please try again.`};
    C.push({role:'model', parts});
    const text = parts.filter(p => p.text && !p.thought).map(p => p.text).join('').trim(), calls = parts.filter(p => p.functionCall);
    if (text){ bubble.text = bubble.pending ? text : bubble.text + '\n\n' + text; bubble.pending = false; renderAIMsgs(); }
    if (!calls.length){ if (bubble.pending){ bubble.text = 'Done.'; bubble.pending = false; } return bubble.text; }
    const out = [];
    for (const c of calls){
      if (AI.ctl.signal.aborted) throw {code:'cancelled'};
      const tool = AI_TOOLS_ALL.find(t => t.name === c.functionCall.name); let r;
      try { r = tool ? await tool.execute(c.functionCall.args || {}, {signal:AI.ctl.signal}) : 'Error: unknown tool'; } catch(e){ r = 'Error: ' + (e && e.message ? e.message : e); }
      out.push({functionResponse:{name:c.functionCall.name, response:{result: r === undefined ? 'done' : r}}});
    }
    C.push({role:'user', parts:out});
  }
  bubble.pending = false; return bubble.text;
}
function gemTrim(){ // keep the last few exchanges, always starting at a plain user message
  const C = AI.gContents; if (C.length <= 40) return;
  let i = C.length - 40; while (i < C.length && !(C[i].role === 'user' && C[i].parts.some(p => p.text))) i++;
  AI.gContents = C.slice(i);
}
function aiSettingsHTML(){
  const prov = aiProvider();
  return `<details class="ai-set" ${AI.setOpen || (prov === 'gemini' && !AI.gKey) ? 'open' : ''}><summary>AI settings — using <b>${prov === 'gemini' ? `Gemini (${esc(AI.gModel)})` : 'Claude'}</b></summary>
    <div class="ai-setbody">
      <label class="row" style="gap:8px"><input type="radio" name="aiprov" id="aip1" data-act="ai-prov" value="gemini" ${prov === 'gemini' ? 'checked' : ''}> <span><b>Gemini</b> — your own Google API key (works in the offline file)</span></label>
      <label class="row" style="gap:8px"><input type="radio" name="aiprov" id="aip2" data-act="ai-prov" value="claude" ${prov === 'claude' ? 'checked' : ''}> <span><b>Claude</b> — works when the app is opened on claude.ai</span></label>
      ${prov === 'gemini' ? `
      <label class="field"><span>Gemini API key</span><input type="password" id="gKey" value="${esc(AI.gKey)}" placeholder="Paste your key here" autocomplete="off" spellcheck="false"></label>
      <div class="row"><button class="btn small primary" data-act="g-save">Save key</button><button class="btn small" data-act="g-test">Test key</button>${AI.gKey ? '<button class="btn small danger" data-act="g-remove">Remove key</button>' : ''}</div>
      ${AI.gStatus ? `<p style="margin:0;font-size:14px;color:${/✓/.test(AI.gStatus) ? 'var(--ok)' : 'var(--warn)'}">${esc(AI.gStatus)}</p>` : ''}
      <label class="field"><span>Model</span>${AI.gModels.length ? `<select id="gModel" data-act="g-model">${AI.gModels.map(m => opt(m, m, m === AI.gModel)).join('')}</select>` : `<input type="text" id="gModelT" data-act="g-model-t" value="${esc(AI.gModel)}">`}</label>
      <p style="margin:0;font-size:13px;color:var(--muted)">The key is saved only in this browser on this computer. Do not share this file with others after saving a key.</p>` : ''}
    </div></details>`;
}

/* ---------------- start ---------------- */
(function start(){
  let restored = false;
  try { const o = JSON.parse(localStorage.getItem(LS_CUR) || 'null'); if (o && o.tables && o.tables.length){ restore(o); restored = true; if (S.isSample) for (const [name, text] of Object.entries(SAMPLE)) RAW[`${name}.csv`] = {buf: new TextEncoder().encode(text + '\n').buffer, ext:'csv'}; } } catch(e){}
  if (!restored) loadSample();
  render(); renderAI();
})();
</script>
