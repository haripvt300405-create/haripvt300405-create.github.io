<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hariharan M | Data Analyst</title>

<meta property="og:title" content="Hariharan M | Data Analyst">
<meta property="og:description" content="Data Analyst skilled in SQL, Power BI, Advanced Excel (VBA) and Python. I&#39;ve audited 3M+ records and cut manual reporting time by up to 70% through automation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="css">
/* Layout: editorial portfolio after the owner's reference — giant background word behind a tall portrait, name left, stats right; numbered work rows; a three-column skills / process / quote band; certifications; contact band. Black and red palette from the owner's reference. v5.3 */
:root{
  --bg:#0A0A0A; --bg2:#111111; --card:#161616; --accent:#D7141E; --cyan:#E5484D; --sky:#FF3B3F;
  --text:#F5F5F5; --muted:#9A9A9A; --line:#2A2A2A; --success:#E5484D; --danger:#FF6B6B;
  --f-display:"Anton","Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --f-script:"Caveat","Segoe Script","Brush Script MT",cursive;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 1rem/1.6 var(--f-body);padding-inline:16px}
.wrap{max-width:72rem;margin:0 auto;padding-block:0 3rem;display:grid;gap:0}
a{color:var(--sky)}
:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
.band{border-top:1px solid var(--line);padding-block:3rem}
.h2{font:400 clamp(1.5rem,3vw,2rem)/1.1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;margin:0}
.lbl{font:500 .72rem/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--sky)}
.spark{color:var(--sky)}

/* top strip */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:rgba(10,10,10,.92);backdrop-filter:blur(8px);display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding-block:.85rem;border-bottom:1px solid var(--line)}
.brand{display:grid;line-height:1.35;font:500 .7rem/1.35 var(--f-mono);letter-spacing:.14em;text-transform:uppercase}
.brand b{color:var(--sky);font-weight:500}
.brand span{color:var(--muted)}
.top nav{display:flex;gap:1.1rem;flex-wrap:wrap;align-items:center;font:500 .72rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.top nav a{color:var(--muted);text-decoration:none}
.top nav a:hover{color:var(--sky)}
.avail{display:inline-flex;align-items:center;gap:.45rem;color:var(--text)}
.avail i{width:.5rem;height:.5rem;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px rgba(229,72,77,.18)}

/* hero */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,.8fr);align-items:end;gap:1.5rem;padding-block:2rem 0;min-height:34rem;overflow:hidden}
.bgword{position:absolute;left:0;right:0;top:.5rem;text-align:center;font:400 clamp(5rem,19vw,15.5rem)/.85 var(--f-display);letter-spacing:.01em;text-transform:uppercase;color:transparent;background:linear-gradient(180deg,#E3161F 0%,#B3111A 55%,rgba(120,8,14,.35) 100%);-webkit-background-clip:text;background-clip:text;pointer-events:none;white-space:nowrap;z-index:0}
body.editing .bgword{pointer-events:auto}
.h-left,.h-photo,.h-right{position:relative;z-index:1;min-width:0}
.h-left{display:grid;gap:.6rem;padding-bottom:2.5rem;align-self:end}
.hello{font:600 clamp(1.8rem,3.5vw,2.6rem)/1 var(--f-script);color:var(--text)}
.name{font:400 clamp(2.4rem,4.6vw,4.2rem)/.95 var(--f-display);text-transform:uppercase;margin:0;letter-spacing:.01em;white-space:nowrap}
.role{font:600 clamp(1rem,1.8vw,1.25rem)/1.25 var(--f-body);color:var(--sky);text-transform:uppercase;letter-spacing:.02em;margin:.3rem 0 0}
.bio{margin:0;color:var(--muted);font-size:.95rem;max-width:36ch;white-space:pre-line}
.where{display:flex;align-items:center;gap:.5rem;font:500 .72rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:.4rem}
.cta{display:flex;gap:.65rem;flex-wrap:wrap;margin-top:.6rem}
.btn{font:600 .85rem/1 var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:.85rem 1.2rem;border-radius:999px;text-decoration:none;border:1px solid var(--accent);cursor:pointer;display:inline-flex;align-items:center;gap:.5rem}
.btn.primary{background:var(--accent);color:var(--text)}
.btn.ghost{color:var(--sky);background:transparent}
.h-photo{align-self:end;justify-self:center;width:100%;max-width:26rem;aspect-ratio:4/5;position:relative}
.h-photo img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent 100%);mask-image:linear-gradient(180deg,#000 70%,transparent 100%)}
.h-photo .ph{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:.5rem;border:1px dashed var(--line);border-bottom:0;border-radius:200px 200px 0 0;background:linear-gradient(180deg,rgba(22,22,22,.9),rgba(10,10,10,0))}
.h-photo .ph big{font:400 6rem/1 var(--f-display);color:var(--sky)}
.h-photo .pbtn{position:absolute;left:50%;bottom:1.25rem;transform:translateX(-50%);z-index:2}
.h-right{display:grid;gap:1.5rem;padding-bottom:2.5rem;align-self:end}
.note-row{display:flex;gap:.8rem;align-items:center;font-size:.9rem;color:var(--text)}
.note-row .ring{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--sky)}
.stats{display:grid;gap:0}
.stat{display:flex;align-items:center;gap:1rem;padding-block:.9rem;border-top:1px solid var(--line)}
.stat b{font:400 2.4rem/1 var(--f-display);color:var(--sky);min-width:4.2rem;font-variant-numeric:tabular-nums}
.stat span{font:500 .72rem/1.35 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
@media (max-width:860px){
  .hero{grid-template-columns:1fr;min-height:0;padding-top:1.5rem}
  .bgword{font-size:clamp(4rem,22vw,9rem)}
  .h-left{order:1;padding-bottom:0;padding-top:clamp(3rem,16vw,6rem)}
  .h-photo{order:2;max-width:20rem}
  .h-right{order:3;padding-bottom:1rem}
}

/* about */
.about{display:grid;grid-template-columns:14rem 1fr;gap:2rem}
.about p{margin:0;font-size:1.1rem;max-width:62ch;white-space:pre-line}
@media (max-width:700px){.about{grid-template-columns:1fr;gap:1rem}}

/* work */
.sec-head{display:flex;align-items:center;gap:1rem;margin-bottom:1.25rem;flex-wrap:wrap}
.sec-head .rule{flex:1;height:1px;background:var(--line);min-width:2rem}
.sec-head .side{font:500 .72rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.intro{margin:-.5rem 0 1.25rem;color:var(--muted);max-width:62ch}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.25rem}
.tab{font:500 .74rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:.55rem .85rem;border-radius:999px;border:1px solid var(--line);background:var(--bg2);color:var(--muted);cursor:pointer;display:inline-flex;gap:.45rem;align-items:center}
.tab b{font-weight:500;color:var(--sky);font-variant-numeric:tabular-nums}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--text)}
.tab[aria-pressed="true"] b{color:var(--text)}
.addpanel{background:var(--card);border:1px dashed var(--accent);border-radius:10px;padding:1rem;display:grid;gap:.6rem;margin-bottom:1.25rem}
.addpanel .row{display:flex;gap:.5rem;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(18rem,1fr));gap:1.5rem 1.25rem}
.wcard{display:grid;gap:.85rem;position:relative;min-width:0;align-content:start}
.cover{aspect-ratio:16/10;max-width:100%;width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative;cursor:pointer;display:block;padding:0;color:inherit;text-align:left}
.cover:hover{border-color:var(--accent)}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.cover:hover img{transform:scale(1.03)}
.cover svg{width:100%;height:100%;display:block}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:.4rem;background:linear-gradient(135deg,rgba(215,20,30,.25),rgba(215,20,30,.1));font:600 .78rem/1 var(--f-mono);color:var(--sky);letter-spacing:.06em;text-transform:uppercase}
.cover .ph big{font:400 2.6rem/1 var(--f-display);color:var(--text)}
.cover .excerpt{position:absolute;inset:0;padding:1rem;font-size:.85rem;line-height:1.5;color:var(--muted);overflow:hidden;background:var(--bg2);white-space:pre-line}
.badge{position:absolute;left:.6rem;top:.6rem;font:500 .64rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:.35rem .5rem;border-radius:4px;background:rgba(10,10,10,.85);color:var(--cyan);border:1px solid var(--line)}
.badge.count{left:auto;right:.6rem}
.wrow{display:grid;grid-template-columns:auto 1fr auto;gap:.9rem;align-items:start}
.wnum{font:400 2.1rem/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.wtxt{min-width:0;display:grid;gap:.25rem}
.wcard h3{margin:0;font:600 1rem/1.25 var(--f-body);text-transform:uppercase;letter-spacing:.03em}
.wcat{font:500 .7rem/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.arrow{width:2.4rem;height:2.4rem;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;display:grid;place-items:center;font-size:1.1rem}
.arrow:hover{border-color:var(--accent);color:var(--sky)}
.wcard .desc{margin:0;font-size:.88rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
body.editing .wcard .desc{display:block;-webkit-line-clamp:unset}
.tags{display:flex;gap:.4rem;flex-wrap:wrap}
.tag{font:500 .68rem/1 var(--f-mono);padding:.32rem .5rem;background:rgba(215,20,30,.14);color:var(--sky);border-radius:4px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:2rem 1rem;text-align:center;color:var(--muted)}

/* skills / process / quote band */
.tri{display:grid;grid-template-columns:1fr 1fr .8fr;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tri > div{padding:clamp(1.25rem,3vw,2rem);min-width:0;display:grid;gap:1.1rem;align-content:start}
.tri > div + div{border-left:1px solid var(--line)}
@media (max-width:960px){.tri{grid-template-columns:1fr}.tri > div + div{border-left:0;border-top:1px solid var(--line)}}
.edu{display:grid;gap:.9rem}
.edu-item{display:grid;grid-template-columns:1fr auto;gap:.2rem 1rem;position:relative;padding-right:0}
.edu-item h4{margin:0;font:600 .95rem/1.3 var(--f-body)}
.edu-item .sub{margin:0;color:var(--muted);font-size:.84rem;grid-column:1}
.edu-item .yr{font:500 .78rem/1.3 var(--f-mono);color:var(--sky);grid-row:1;grid-column:2}
.edu-item .d{grid-column:1/-1;margin:0;color:var(--muted);font-size:.84rem}
.chips{display:flex;gap:.45rem;flex-wrap:wrap}
.chip{font:500 .7rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:.55rem .7rem;border:1px solid var(--line);border-radius:4px;background:var(--bg2);position:relative}
.chip .del{position:static;width:1.2rem;height:1.2rem;font-size:.8rem;margin-left:.35rem;vertical-align:middle}
.steps{display:grid;gap:0}
.step{display:grid;grid-template-columns:2rem 2.6rem 1fr;gap:.8rem;align-items:start;padding-bottom:1rem;position:relative}
.step .n{font:400 1.3rem/2.6rem var(--f-display);color:var(--accent)}
.step .ic{width:2.6rem;height:2.6rem;border-radius:50%;border:1px solid var(--accent);display:grid;place-items:center;color:var(--sky);background:var(--bg);position:relative;z-index:1}
.step:not(:last-child) .ic::after{content:"";position:absolute;top:100%;left:50%;width:1px;height:1rem;background:var(--line)}
.step h4{margin:.15rem 0 .15rem;font:600 .85rem/1.3 var(--f-body);text-transform:uppercase;letter-spacing:.04em;color:var(--sky)}
.step p{margin:0;color:var(--muted);font-size:.84rem}
.quote{background:linear-gradient(160deg,var(--accent) 0%,#8E0D14 60%,#3A0507 100%)}
.quote .qm{font:400 4rem/.6 var(--f-display);color:rgba(245,245,245,.55);height:2rem}
.quote blockquote{margin:0;font:500 1.15rem/1.5 var(--f-body);white-space:pre-line}
.quote .sign{font:600 2rem/1 var(--f-script)}
.quote .qcta{margin-top:auto;font:500 .72rem/1.4 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(245,245,245,.85)}

/* certifications */
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:1.25rem}
.cert{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:grid;position:relative;min-width:0}
.cert .cover{border:0;border-bottom:1px solid var(--line);border-radius:0;aspect-ratio:4/3;background:#fff}
.cert .cover img{object-fit:contain;background:#fff}
.cert .cb{padding:1rem 1.1rem 1.1rem;display:grid;gap:.3rem;min-width:0}
.cert h3{margin:0;font:600 .98rem/1.3 var(--f-body);padding-right:1.6rem}
.cert .iss{margin:0;color:var(--muted);font-size:.84rem}
.cert .meta{display:flex;justify-content:space-between;gap:.5rem;align-items:center;margin-top:.3rem;font:500 .72rem/1.2 var(--f-mono);color:var(--sky)}

/* resume */
.res-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.res-actions{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.res-frame{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:clamp(.6rem,2vw,1.2rem);max-height:85vh;overflow:auto;display:grid;gap:1rem;justify-items:center}
.res-frame img{width:100%;max-width:56rem;border-radius:4px;box-shadow:0 6px 24px rgba(0,0,0,.4);background:#fff;display:block}
.res-empty{border:1px dashed var(--line);border-radius:10px;padding:2.5rem 1rem;text-align:center;color:var(--muted)}
.res-meta{font:500 .75rem/1.3 var(--f-mono);color:var(--muted)}

/* contact */
.contact{display:grid;grid-template-columns:1fr 1.2fr;gap:2rem;align-items:start}
@media (max-width:760px){.contact{grid-template-columns:1fr}}
.contact .big{font:400 clamp(2.4rem,6vw,4rem)/.95 var(--f-display);text-transform:uppercase;margin:0}
.contact .blurb{color:var(--muted);margin:1rem 0 1.25rem;max-width:40ch;white-space:pre-line}
.clist{display:grid}
.crow{display:grid;grid-template-columns:2.8rem 1fr auto;gap:1rem;align-items:center;padding-block:.9rem;border-bottom:1px solid var(--line);min-width:0}
.crow:first-child{border-top:1px solid var(--line)}
.crow .ic{width:2.6rem;height:2.6rem;border-radius:50%;border:1px solid var(--accent);display:grid;place-items:center;color:var(--sky)}
.crow .v{min-width:0;word-break:break-word;font-size:.95rem}
.crow .v a{color:var(--text);text-decoration:none}
.crow .v a:hover{color:var(--sky)}
.copy{font:500 .7rem/1 var(--f-mono);padding:.4rem .6rem;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
footer{border-top:1px solid var(--line);padding-top:1.25rem;font:400 .75rem/1.4 var(--f-mono);color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem}

/* ---------- edit mode ---------- */
body:not(.editing) .edit-only{display:none!important}
body:not(.owner) .owner-only{display:none!important}
body.editing [data-bind]{outline:1px dashed rgba(255,59,63,.5);outline-offset:3px;border-radius:2px;cursor:text;min-width:1ch}
body.editing [data-bind]:focus{outline:2px solid var(--sky);background:rgba(215,20,30,.08)}
body.editing [data-bind]:empty::before{content:attr(data-ph);color:var(--muted);opacity:.7}
.ebtn{font:600 .76rem/1 var(--f-body);padding:.55rem .8rem;border-radius:6px;border:1px dashed var(--accent);background:rgba(215,20,30,.12);color:var(--sky);cursor:pointer}
.ebtn:hover{background:rgba(215,20,30,.22)}
.ebtn.solid{border-style:solid;background:var(--accent);color:var(--text)}
.ebtn.ok{border-style:solid;background:var(--success);border-color:var(--success);color:#fff}
.ebtn:disabled{opacity:.5;cursor:default}
.addrow{display:flex;gap:.6rem;flex-wrap:wrap}
.del{position:absolute;top:.5rem;right:.5rem;width:1.8rem;height:1.8rem;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--danger);cursor:pointer;font:600 .95rem/1 var(--f-body);z-index:3}
.field{display:grid;gap:.25rem;text-align:left;width:100%;max-width:30rem}
.field label{font:500 .66rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{font:400 .84rem/1.3 var(--f-mono);padding:.5rem .6rem;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%}
.ownrow{display:flex;gap:.4rem;flex-wrap:wrap}
.ownrow .ebtn{padding:.45rem .6rem;font-size:.7rem}
.editbar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.status{font:500 .74rem/1.3 var(--f-mono);color:var(--muted)}
.status.warn{color:#FBBF24}.status.err{color:var(--danger)}.status.good{color:var(--success)}
.meter{font:500 .7rem/1 var(--f-mono);color:var(--muted)}
.helpbar{margin-top:1rem;background:var(--card);border:1px solid var(--accent);border-radius:8px;padding:.8rem 1rem;font-size:.88rem;color:var(--muted)}
.helpbar b{color:var(--text)}
.preview-chip{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kpi{background:var(--card);padding:.85rem 1rem;display:grid;gap:.2rem}
.kpi span{font-size:.78rem;color:var(--muted)}
.kpi b{font:500 1.4rem/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:1.25rem;flex-wrap:wrap;font:500 .78rem/1 var(--f-mono);color:var(--muted)}
.legend i{display:inline-block;width:.75rem;height:.75rem;border-radius:2px;margin-right:.4rem;vertical-align:-1px}
.chart-box{overflow-x:auto}
.chart-box svg{display:block;width:100%;min-width:30rem;height:auto}

/* detail viewer */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:grid;place-items:start center;overflow:auto;padding:calc(1rem + env(safe-area-inset-top,0px)) 16px calc(1rem + env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:72rem;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:clamp(1rem,3vw,1.75rem);display:grid;gap:1rem;min-width:0}
.sheet-head{display:flex;justify-content:space-between;gap:1rem;align-items:start}
.sheet-head h3{margin:.3rem 0 0;font:400 clamp(1.6rem,3.5vw,2.4rem)/1.05 var(--f-display);text-transform:uppercase}
.sheet .x{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font:600 1.2rem/1 var(--f-body);cursor:pointer}
.sheet .body-text{margin:0;white-space:pre-line;max-width:70ch;line-height:1.7}
.sheet .gallery{display:grid;gap:1rem}
.sheet .gallery img{width:100%;border-radius:8px;border:1px solid var(--line);display:block}
.appframe{width:100%;height:75vh;border:1px solid var(--line);border-radius:8px;background:#fff;display:block}
.sheet .bar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.sheet .hint{font:400 .75rem/1.4 var(--f-mono);color:var(--muted)}
.wmeta{display:flex;justify-content:space-between;gap:.5rem;font:500 .68rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--cyan)}
.wmeta time{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.cover img{transition:none}}

  /* ---------- files ---------- */
  function pickFile(accept,cb,multi){var i=document.createElement('input');i.type='file';i.accept=accept;if(multi)i.multiple=true;i.onchange=function(){if(i.files.length)cb(multi?Array.prototype.slice.call(i.files):i.files[0])};i.click()}
  function shrink(file,maxW,square,cb){
    var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){
      var sw=img.width,sh=img.height,sx=0,sy=0;
      if(square){var m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=sh=m}
      var sc=Math.min(1,maxW/sw),c=document.createElement('canvas');c.width=Math.round(sw*sc);c.height=Math.round(sh*sc);
      var g=c.getContext('2d');g.fillStyle='#0A0A0A';g.fillRect(0,0,c.width,c.height);g.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.82));
    };img.onerror=function(){setStatus('That file could not be read as an image. Try a JPG or PNG.','err')};img.src=r.result};r.readAsDataURL(file);
  }
  function shrinkAll(files,cb){var out=[],n=files.length,done=0;files.forEach(function(f,i){shrink(f,1600,false,function(d){out[i]=d;if(++done===n)cb(out.filter(Boolean))})})}
  function readText(file,cb){var r=new FileReader();r.onload=function(){cb(r.result)};r.readAsText(file)}
  function parseCSV(txt){
    var rows=txt.replace(/\r/g,'').split('\n').filter(function(l){return l.trim()}).map(function(l){
      var out=[],cur='',q=false;for(var i=0;i<l.length;i++){var ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===','&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(function(s){return s.trim()})});
    if(rows.length<2||rows[0].length<2)throw new Error('Need a header row and at least one data row with 2+ columns.');
    var head=rows[0],body=rows.slice(1,61),series=[];
    for(var c=1;c<head.length&&series.length<4;c++){var vals=body.map(function(r){return parseFloat(String(r[c]||'').replace(/[₹,%\s]/g,''))});if(vals.some(isFinite))series.push({name:head[c]||('Series '+c),values:vals.map(function(v){return isFinite(v)?v:0})})}
    if(!series.length)throw new Error('No number columns found after the first column.');
    return {labels:body.map(function(r){return r[0]}),series:series,title:series.map(function(s){return s.name}).join(' vs ')+(head[0]?' by '+head[0]:'')};
  }
  function htmlTitle(h,fallback){var m=/<title[^>]*>([^<]*)<\/title>/i.exec(h);return (m&&m[1].trim())||fallback}
  function stripExt(n){return String(n||'').replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim()}

    else if(kind==='chart')pickFile('.csv,text/csv,text/plain',function(f){readText(f,function(txt){try{var c=parseCSV(txt);newItem('chart',{title:c.title,tags:'CSV',chart:{labels:c.labels,series:c.series,title:c.title}})}catch(x){setStatus('CSV not read: '+x.message,'err')}})});
    else if(kind==='html')pickFile('.html,.htm,text/html',function(f){if(f.size>4*1024*1024){setStatus('That HTML file is over 4 MB. Try a smaller build.','err');return}readText(f,function(h){newItem('html',{title:htmlTitle(h,stripExt(f.name)||'New app'),tags:'HTML, Built with Claude',html:h})})});

  /* ---------- resume ---------- */
  function resMsg(m,c){var el=document.getElementById('resStatus');if(el){el.textContent=m;el.className='status '+(c||'')}else setStatus(m,c)}
  var PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/', pdfReady=null;
  function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error('Could not load '+src))};document.head.appendChild(s)})}
  function loadPdf(){if(!pdfReady)pdfReady=loadScript(PDFJS+'pdf.min.js').then(function(){return loadScript(PDFJS+'pdf.worker.min.js')}).then(function(){window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';return window.pdfjsLib});return pdfReady}
  function readURL(file){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(file)})}
  function readBuf(file){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsArrayBuffer(file)})}
  function pdfToImages(file,maxPages,width,onPage){
    return Promise.all([loadPdf(),readBuf(file)]).then(function(r){
      return r[0].getDocument({data:new Uint8Array(r[1])}).promise.then(function(pdf){
        var n=Math.min(pdf.numPages,maxPages),pages=[],chain=Promise.resolve();
        for(var i=1;i<=n;i++)(function(i){chain=chain.then(function(){return pdf.getPage(i).then(function(pg){
          var v0=pg.getViewport({scale:1}),v=pg.getViewport({scale:width/v0.width}),c=document.createElement('canvas');
          c.width=Math.round(v.width);c.height=Math.round(v.height);var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
          return pg.render({canvasContext:g,viewport:v}).promise.then(function(){pages.push(c.toDataURL('image/jpeg',0.82));if(onPage)onPage(i,n)});
        })})})(i);
        return chain.then(function(){return pages});
      });
    });
  }
  function certFromFile(file,c,done){
    var isPdf=/pdf$/i.test(file.type)||/\.pdf$/i.test(file.name);
    if(file.size>6*1024*1024){setStatus(file.name+' is over 6 MB. Please use a smaller file.','err');return}
    if(!c.title)c.title=stripExt(file.name)||'Certificate';
    if(isPdf){setStatus('Reading '+file.name+'…');Promise.all([pdfToImages(file,1,1400),readURL(file)]).then(function(r){c.img=r[0][0]||'';c.file=file.size<2.5*1024*1024?r[1]:'';c.ext='pdf';done()}).catch(function(){setStatus(file.name+' could not be read. Try a JPG or PNG of the certificate.','err')});return}
    shrink(file,1400,false,function(d){c.img=d;c.file='';c.ext='jpg';done()});
  }
  function uploadResume(file,done){
    var isPdf=/pdf$/i.test(file.type)||/\.pdf$/i.test(file.name);
    if(file.size>6*1024*1024){resMsg('This file is over 6 MB. Please upload a smaller PDF or image.','err');return}
    if(!isPdf){shrink(file,1400,false,function(d){readURL(file).then(function(orig){S.resume.name=file.name;S.resume.ext=/png$/i.test(file.type)?'png':'jpg';S.resume.file=orig;S.resume.pages=[d];done()})});return}
    resMsg('Reading PDF…');
    Promise.all([loadPdf(),readBuf(file),readURL(file)]).then(function(r){
      var lib=r[0],buf=r[1],orig=r[2];
      return lib.getDocument({data:new Uint8Array(buf)}).promise.then(function(pdf){
        var n=Math.min(pdf.numPages,8),pages=[],chain=Promise.resolve();
        for(var i=1;i<=n;i++)(function(i){chain=chain.then(function(){return pdf.getPage(i).then(function(pg){
          var v0=pg.getViewport({scale:1}),v=pg.getViewport({scale:1400/v0.width}),c=document.createElement('canvas');
          c.width=Math.round(v.width);c.height=Math.round(v.height);var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
          return pg.render({canvasContext:g,viewport:v}).promise.then(function(){pages.push(c.toDataURL('image/jpeg',0.82));resMsg('Reading PDF… page '+i+' of '+n)});
        })})})(i);
        return chain.then(function(){S.resume.name=file.name;S.resume.ext='pdf';S.resume.file=orig;S.resume.pages=pages;done()});
      });
    }).catch(function(){resMsg('This PDF could not be read here. Upload a JPG or PNG of your resume instead.','err')});
  }
  function dataURLtoBlob(d){var p=d.split(','),bin=atob(p[1]),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u])}
  function saveFile(name,data,msg){

    if(act==='w-move'&&it){var i=idxOf(id),j=i+(+b.getAttribute('data-dir'));if(j>=0&&j<S.work.items.length){S.work.items.splice(i,1);S.work.items.splice(j,0,it);re()}return}
    if(act==='del'){var p=b.getAttribute('data-path').split('.'),idx=+p.pop(),arr=get(p.join('.'));arr.splice(idx,1);re();return}
    if(act==='add-tool'){S.toolkit.items.push({name:'New skill',detail:'Details'});re();return}
    if(act==='add-exp'){S.experience.items.unshift({title:'Job title',sub:'Company · focus',year:'',desc:'What you did'});re();return}
    if(act==='add-edu'){S.education.items.push({title:'Course / degree',sub:'Institute',year:''});re();return}
    if(act==='photo'){pickFile('image/*',function(f){shrink(f,900,false,function(d){S.photo=d;re()})});return}
  }
  app.addEventListener('click',onClick);
  document.getElementById('modal').addEventListener('click',onClick);

  /* ---------- save (publish a new version) ---------- */
  var SKEL='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>';
  var FONTS='<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">';
  function buildDoc(){
    var css=document.getElementById('css').textContent, js=document.getElementById('main').textContent;
    var json=JSON.stringify(S).replace(/</g,'\\u003c');
    return SKEL+'<title>Data Analytics Portfolio</title>\n'+FONTS+'\n<style id="css">'+css+'</style>\n\n<div id="app"></div>\n<div id="modal" class="modal" hidden></div>\n\n<script type="application/json" id="state">'+json+'<\/script>\n\n<script id="main">'+js+'<\/script>\n';
  }
  function buildStandalone(){
    var css=document.getElementById('css').textContent, js=document.getElementById('main').textContent;
    var json=JSON.stringify(S).replace(/</g,'\\u003c');
    var nm=(S.hero.title||'Portfolio')+' | '+(S.brand.role||'Data Analyst'), desc=S.hero.bio||'';
    var reset=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
    return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n<title>'+esc(nm)+'</title>\n<meta name="description" content="'+esc(desc)+'">\n<meta property="og:title" content="'+esc(nm)+'">\n<meta property="og:description" content="'+esc(desc)+'">\n'+FONTS+'\n<style>'+reset+'</style>\n<style id="css">'+css+'</style>\n</head>\n<body>\n<div id="app"></div>\n<div id="modal" class="modal" hidden></div>\n<script type="application/json" id="state">'+json+'<\/script>\n<script id="main">'+js+'<\/script>\n</body>\n</html>\n';
  }
  var saving=false;
  function save(){
    if(STANDALONE){
      if(!dirty)return;
      localDL.save({filename:'index.html',data:buildStandalone()}).then(function(){
        dirty=false;BASE=JSON.stringify(S);try{localStorage.removeItem('pf-draft')}catch(x){}
        setStatus('Downloaded index.html. Upload it to GitHub to publish.','good');
      });
      return;
    }
    if(saving||!dirty)return;
    if(!art){setStatus('Saving is not available in this view. Open the page from claude.ai while signed in.','err');return}
    var doc=buildDoc();
    if(doc.length>MAX_BYTES){setStatus('Too large to save ('+(doc.length/1048576).toFixed(1)+' MB). Remove some images or apps and try again.','err');return}
    saving=true;setStatus('Saving…');
    try{sessionStorage.setItem('pf-stash',JSON.stringify({base:BASE.length+':'+BASE.slice(0,200),data:S}))}catch(x){}
    art.publish(doc).then(function(){setStatus('Saved','good')},function(err){
      saving=false;var c=err&&err.code;
      if(c==='conflict')setStatus('A newer version was saved elsewhere. The page will reload with it; your edits are kept to restore.','warn');
      else if(c==='not_writer'||c==='not_granted'){canEdit=false;editing=false;render();setStatus('You can view this page but not edit it.','err')}
      else if(c==='rate_limited')setStatus('Saving too often. Wait a minute, then press Save again.','warn');
      else setStatus('Could not save ('+(c||'error')+'). Try again.','err');
    });
  }

  /* ---------- boot ---------- */
  render();
  try{var st=JSON.parse(sessionStorage.getItem('pf-stash')||'null');if(st){sessionStorage.removeItem('pf-stash');if(JSON.stringify(st.data)!==JSON.stringify(S)&&st.base!==BASE.length+':'+BASE.slice(0,200)){window.__pfRestore=st.data}}}catch(x){}
  if(STANDALONE){
    dl=localDL;
    canEdit=location.hash==='#edit';
    if(canEdit){try{var dr=localStorage.getItem('pf-draft');if(dr&&dr!==JSON.stringify(S)){S=JSON.parse(dr);editing=true;dirty=true;statusMsg='Restored your unsaved draft';statusCls='warn'}}catch(x){}}
    render();
  }
  if(window.claude&&window.claude.use){
    window.claude.use('downloads').then(function(d){dl=d;if(d)render()}).catch(function(){});
    Promise.all([window.claude.use('artifact'),window.claude.use('user')]).then(function(r){
      art=r[0];var u=r[1];
      return (u?u.canEdit().catch(function(){return false}):Promise.resolve(!!art)).then(function(ok){
        canEdit=!!(art&&ok)&&!RECRUITER;
        if(canEdit&&window.__pfRestore){S=window.__pfRestore;editing=true;dirty=true;statusMsg='Restored your unsaved edits';statusCls='warn'}
        render();
      });
    }).catch(function(){});
  }
})();
</script>
</body>
</html>
