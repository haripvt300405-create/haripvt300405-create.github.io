<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>ATS Resume Tailor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
/* Layout: one column, three stacked work areas (base resume, job description, tailored result) — built for a phone first. */
:root{
  --bg:#1e2026; --panel:#272a31; --raise:#30343c; --field:#3a3e47; --line:#454a55;
  --fg:#f1ede8; --muted:#b9b3ad; --accent:#e0899f; --accent-ink:#2a1219; --ok:#7fcf9f; --warn:#f0c36d; --bad:#f08a7a;
  --paper:#ffffff; --paper-ink:#1d1d1f; --paper-rule:#9aa3ad;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-resume: Calibri, Carlito, "Segoe UI", Arial, sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f3f0ee; --panel:#ffffff; --raise:#f7f3f1; --field:#ffffff; --line:#d9d1cd;
  --fg:#24212a; --muted:#625b62; --accent:#b4486a; --accent-ink:#ffffff; --ok:#1f7a49; --warn:#9a6a00; --bad:#b33a2a;
  --paper:#ffffff; --paper-ink:#1d1d1f; --paper-rule:#9aa3ad; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#f3f0ee; --panel:#ffffff; --raise:#f7f3f1; --field:#ffffff; --line:#d9d1cd;
  --fg:#24212a; --muted:#625b62; --accent:#b4486a; --accent-ink:#ffffff; --ok:#1f7a49; --warn:#9a6a00; --bad:#b33a2a;
  --paper:#ffffff; --paper-ink:#1d1d1f; --paper-rule:#9aa3ad; color-scheme:light }
*{box-sizing:border-box}
body{background:var(--bg); color:var(--fg); font:17px/1.55 var(--f-body); margin:0}
.wrap{max-width:860px; margin:0 auto; padding-block:20px 60px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); display:flex; flex-direction:column; gap:22px}
header.top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.brand h1{font:800 clamp(26px,5vw,34px)/1.1 var(--f-display); margin:0; letter-spacing:-.01em}
.brand h1 b{color:var(--accent); font-weight:800}
.ver{font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.aiwho{font-size:14px; color:var(--muted); background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:6px 14px; cursor:pointer}
.aiwho:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
section.card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px; display:flex; flex-direction:column; gap:14px; min-width:0}
.sec-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.sec-head h2{font:700 21px/1.2 var(--f-display); margin:0}
.step{font-size:13px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:14px}
label.fld{display:flex; flex-direction:column; gap:6px; font-weight:600; font-size:15px; min-width:0}
input[type=text], input[type=password], textarea, select{width:100%; font:inherit; font-size:17px; color:var(--fg); background:var(--field); border:1.5px solid var(--line); border-radius:10px; padding:11px 13px}
textarea{resize:vertical; min-height:120px; line-height:1.45}
#jdText{min-height:220px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (max-width:560px){ .row2{grid-template-columns:1fr} }
.btns{display:flex; flex-wrap:wrap; gap:10px}
button{font:inherit; font-weight:700; font-size:16px; border-radius:10px; padding:11px 18px; cursor:pointer; border:1.5px solid var(--line); background:var(--raise); color:var(--fg)}
button.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
button.big{font-size:18px; padding:14px 22px; width:100%}
button.link{background:none; border:none; padding:4px 0; color:var(--accent); font-weight:600; text-decoration:underline; text-underline-offset:3px}
button:disabled{opacity:.5; cursor:not-allowed}
.base-sum{display:grid; grid-template-columns:1fr auto; gap:6px 16px; align-items:start; background:var(--raise); border-radius:12px; padding:14px 16px}
@media (max-width:560px){ .base-sum{grid-template-columns:1fr} .base-sum .pill{justify-self:start} }
.base-sum .nm{font:700 20px/1.25 var(--f-display)}
.base-sum .hl{color:var(--muted)}
.pill{display:inline-block; font-size:13px; font-weight:700; padding:4px 10px; border-radius:999px; background:var(--field); border:1px solid var(--line); white-space:nowrap}
.empty{border:2px dashed var(--line); border-radius:12px; padding:20px; text-align:center; display:flex; flex-direction:column; gap:10px; align-items:center}
.status{font-size:15px; padding:10px 14px; border-radius:10px; background:var(--raise); border-left:4px solid var(--accent)}
.status.bad{border-left-color:var(--bad)} .status.ok{border-left-color:var(--ok)}
/* resume paper */
.paper-box{background:var(--raise); border-radius:12px; padding:12px; max-height:72vh; overflow:auto}
.paper{background:var(--paper); color:var(--paper-ink); font:10.5pt/1.35 var(--f-resume); padding:28px 30px; border-radius:6px; max-width:794px; margin:0 auto; box-shadow:0 2px 10px rgba(0,0,0,.25)}
.paper h3{font-size:20pt; margin:0; line-height:1.15}
.paper .hl{font-size:11.5pt; font-weight:700; margin-top:2px}
.paper .ct{font-size:9.5pt; margin-top:3px; color:#333}
.paper h4{font-size:11pt; letter-spacing:.06em; text-transform:uppercase; margin:14px 0 5px; padding-bottom:2px; border-bottom:1px solid var(--paper-rule)}
.paper p{margin:0}
.paper .job{margin-top:7px}
.paper .jt{display:flex; justify-content:space-between; gap:12px; font-weight:700; flex-wrap:wrap}
.paper .jc{font-style:italic}
.paper ul{margin:3px 0 0; padding-left:18px}
.paper li{margin:1px 0}
/* KPI cards */
.kpis{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px}
@media (max-width:700px){ .kpis{grid-template-columns:repeat(2, minmax(0,1fr))} }
.kpi{background:var(--raise); border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:4px; min-width:0}
.kpi .lab{font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.kpi .val{font:800 34px/1.1 var(--f-display); font-variant-numeric:tabular-nums}
.kpi .sub{font-size:14px; color:var(--muted)}
.g-strong{color:var(--ok)} .g-good{color:var(--ok)} .g-partial{color:var(--warn)} .g-low{color:var(--bad)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-size:14px; padding:4px 10px; border-radius:999px; background:var(--field); border:1px solid var(--line)}
.chip.miss{border-color:var(--warn)}
.dl{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.dl button{font-size:18px; padding:16px}
.fname{font-size:14px; color:var(--muted); word-break:break-all}
/* editor dialog */
.ovl{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:20; display:flex; align-items:flex-start; justify-content:center; overflow:auto; padding:20px max(12px, env(safe-area-inset-right, 0px)) 40px max(12px, env(safe-area-inset-left, 0px))}
.dlg{background:var(--panel); border:1px solid var(--line); border-radius:16px; width:100%; max-width:760px; padding:20px; display:flex; flex-direction:column; gap:14px; margin-top:env(safe-area-inset-top, 0px)}
.dlg h2{font:700 22px/1.2 var(--f-display); margin:0}
.dlg h3{font-size:15px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin:6px 0 0}
.jobbox{border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:10px; background:var(--raise)}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom, 0px)); background:var(--fg); color:var(--bg); padding:12px 18px; border-radius:12px; font-weight:600; z-index:40; max-width:min(92vw,560px)}
@media (prefers-reduced-motion: no-preference){ .spin{display:inline-block; animation:sp 1s linear infinite} @keyframes sp{to{transform:rotate(360deg)}} }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>ATS Resume <b>Tailor</b></h1><span class="ver">Version 1.2</span></div>
    <button class="aiwho" id="aiWho" data-act="ai-open">AI: checking…</button>
  </header>

  <section class="card" id="aiBox" hidden></section>

  <section class="card" aria-labelledby="h-base">
    <div class="sec-head"><div><div class="step">Base resume</div><h2 id="h-base">Your master resume</h2></div></div>
    <div id="baseArea"></div>
  </section>

  <section class="card" aria-labelledby="h-jd">
    <div class="sec-head"><div><div class="step">Job description</div><h2 id="h-jd">The job you are applying for</h2></div></div>
    <div class="row2">
      <label class="fld" for="jdRole">Role (job title)<input type="text" id="jdRole" placeholder="e.g. Supply Chain Manager" autocomplete="off"></label>
      <label class="fld" for="jdCompany">Company<input type="text" id="jdCompany" placeholder="e.g. DP World" autocomplete="off"></label>
    </div>
    <label class="fld" for="jdText">Job description<textarea id="jdText" placeholder="Paste the full job description here (responsibilities, requirements, skills)."></textarea></label>
    <button class="primary big" id="genBtn" data-act="generate">Generate tailored resume</button>
    <div id="genStatus" hidden></div>
  </section>

  <section class="card" aria-labelledby="h-out" id="outCard" hidden>
    <div class="sec-head"><div><div class="step">Tailored resume</div><h2 id="h-out"></h2></div></div>
    <div class="paper-box"><div class="paper" id="paper"></div></div>
    <div class="kpis" id="kpis"></div>
    <div id="gaps"></div>
    <div id="truth"></div>
    <div class="fname" id="fname"></div>
    <div class="dl">
      <button class="primary" data-act="dl-pdf">Download PDF</button>
      <button class="primary" data-act="dl-docx">Download Word</button>
    </div>
  </section>
</div>
<div id="ovl"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ===================== state & storage ===================== */
const APP_VERSION = '1.2';
const LS = {base:'atsr.base', counts:'atsr.counts', last:'atsr.last', jd:'atsr.jd', gkey:'pbigen.gemini.key', gmodel:'pbigen.gemini.model', prov:'atsr.provider'};
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch(e){ return d; } };
const lsSet = (k, v) => { try { if (v == null || v === '') localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){} };
const jGet = (k, d) => { try { const v = lsGet(k, null); return v ? JSON.parse(v) : d; } catch(e){ return d; } };
const S = {
  base: jGet(LS.base, null),            // {data, version, updated}
  out: jGet(LS.last, null),             // last tailored result
  counts: jGet(LS.counts, {}),
  ai: {prov: lsGet(LS.prov, 'auto'), gKey: lsGet(LS.gkey, ''), gModel: lsGet(LS.gmodel, 'gemini-2.5-flash'), open:false, status:''},
  busy:false
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
function toast(msg, ms=3200){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, ms); }
(function(){ const jd = jGet(LS.jd, null); if (jd){ $('jdRole').value = jd.role || ''; $('jdCompany').value = jd.company || ''; $('jdText').value = jd.text || ''; } })();
['jdRole','jdCompany','jdText'].forEach(id => $(id).addEventListener('input', () => lsSet(LS.jd, JSON.stringify({role:$('jdRole').value, company:$('jdCompany').value, text:$('jdText').value}))));

/* ===================== AI providers ===================== */
let SAMPLE = null, DL = null;
(async () => { try { if (window.claude && window.claude.use){ SAMPLE = await window.claude.use('sample'); DL = await window.claude.use('downloads'); } } catch(e){} renderAI(); })();
function provider(){ if (S.ai.prov === 'claude' && SAMPLE) return 'claude'; if (S.ai.prov === 'gemini') return 'gemini'; return SAMPLE ? 'claude' : 'gemini'; }
function renderAI(){
  const p = provider();
  $('aiWho').textContent = p === 'claude' ? 'AI: Claude ✓' : (S.ai.gKey ? `AI: Gemini ✓` : 'AI: add Gemini key');
  const box = $('aiBox'); box.hidden = !S.ai.open && !(p === 'gemini' && !S.ai.gKey);
  if (box.hidden) return;
  box.innerHTML = `<div class="sec-head"><div><div class="step">AI settings</div><h2>Which AI writes the resume</h2></div>${S.ai.open ? '<button data-act="ai-close">Close</button>' : ''}</div>
    ${SAMPLE ? `<label class="fld" for="aiProv">AI service<select id="aiProv" data-act="ai-prov"><option value="claude" ${p==='claude'?'selected':''}>Claude (this page on claude.ai)</option><option value="gemini" ${p==='gemini'?'selected':''}>Gemini (your Google key)</option></select></label>` : '<p class="small muted">Claude is not available outside claude.ai, so this copy uses Gemini with your own Google AI Studio key.</p>'}
    ${p === 'gemini' ? `<label class="fld" for="gKey">Gemini API key<input type="password" id="gKey" value="${esc(S.ai.gKey)}" placeholder="Paste your key from Google AI Studio" autocomplete="off" spellcheck="false"></label>
    <label class="fld" for="gModel">Model<input type="text" id="gModel" value="${esc(S.ai.gModel)}"></label>
    <div class="btns"><button class="primary" data-act="g-save">Save key</button>${S.ai.gKey ? '<button data-act="g-remove">Remove key</button>' : ''}</div>
    <p class="small muted">The key is saved only in this browser. If you already saved it in the Power BI Generator on the same website, it is used here automatically.</p>` : ''}
    ${S.ai.status ? `<div class="status">${esc(S.ai.status)}</div>` : ''}`;
}
function cleanJSON(t){ const s = String(t || ''); const a = s.indexOf('{'), b = s.lastIndexOf('}'); if (a < 0 || b < a) throw new Error('The AI did not return a readable answer. Please try again.'); return JSON.parse(s.slice(a, b + 1)); }
async function aiJSON(prompt){
  if (provider() === 'claude'){
    try { const r = await SAMPLE(prompt, {modelTier:'default'}); return cleanJSON(r.text); }
    catch(e){ if (e && e.code === 'not_granted'){ SAMPLE = null; renderAI(); throw new Error('Claude is not allowed on this page. Choose Gemini in AI settings.'); }
      if (e && e.code === 'rate_limited') throw new Error('Claude is busy right now. Please wait a minute and try again.'); throw e; }
  }
  if (!S.ai.gKey) { S.ai.open = true; renderAI(); throw new Error('Add your Gemini API key first (AI settings at the top).'); }
  // Busy or quota errors: wait and retry, then move to the next model in the list.
  const models = [...new Set([S.ai.gModel, 'gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-2.0-flash', 'gemini-flash-latest'].filter(Boolean))];
  let last = '';
  for (const model of models){
    for (let tryN = 0; tryN < 2; tryN++){
      const gen = {temperature:0.2, responseMimeType:'application/json'};
      if (/2\.5-flash/.test(model)) gen.thinkingConfig = {thinkingBudget:0};
      let res;
      try { res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {method:'POST', headers:{'Content-Type':'application/json','x-goog-api-key':S.ai.gKey}, body:JSON.stringify({contents:[{role:'user', parts:[{text:prompt}]}], generationConfig:gen})}); }
      catch(e){ throw new Error(navigator.onLine === false ? 'You are offline. Connect to the internet and try again.' : 'This window blocks internet access, so Gemini cannot be reached. Open the app from your website (GitHub link) or from the ATS Resume Tailor link on claude.ai, where Claude is used.'); }
      const js = await res.json().catch(() => ({}));
      if (res.ok){
        const parts = (((js.candidates || [])[0] || {}).content || {}).parts || [];
        const txt = parts.filter(p => p.text && !p.thought).map(p => p.text).join('');
        if (txt){ if (model !== S.ai.gModel) aiNote(`Used ${model} because ${S.ai.gModel} was busy.`); return cleanJSON(txt); }
        last = 'Gemini gave an empty answer.'; break;
      }
      const m = (js.error && js.error.message) || String(res.status);
      if (res.status === 400 && /key/i.test(m)) throw new Error('The Gemini key is not valid. Check it in AI settings.');
      if (res.status === 403) throw new Error('Google refused this key. Check that it is active in Google AI Studio.');
      last = m;
      if (res.status === 404) break;                               // model not available: next model
      if (res.status === 429 || res.status >= 500){                 // busy or limit: wait, retry, then next model
        aiNote(`Gemini is busy, trying again${tryN ? ' with another model' : ''}…`);
        await new Promise(r => setTimeout(r, tryN ? 400 : 2500)); continue;
      }
      throw new Error('Gemini error: ' + m);
    }
  }
  throw new Error('All Gemini models are busy right now (' + last + '). Please try again in a few minutes.');
}
let aiNote = () => {};

/* ===================== reading the uploaded resume ===================== */
async function fileText(file){
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const buf = await file.arrayBuffer();
  if (ext === 'pdf'){
    const lib = window.pdfjsLib; if (!lib) throw new Error('The PDF reader did not load. Check your internet and reload the page.');
    try { lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch(e){}
    const pdf = await lib.getDocument({data:new Uint8Array(buf)}).promise; const out = [];
    for (let i = 1; i <= pdf.numPages; i++){
      const pg = await pdf.getPage(i); const tc = await pg.getTextContent(); let line = '', lastY = null;
      tc.items.forEach(it => { const y = Math.round(it.transform[5]); if (lastY !== null && Math.abs(y - lastY) > 2){ out.push(line); line = ''; } line += (line && !/\s$/.test(line) && it.str && !/^\s/.test(it.str) ? (it.hasEOL ? '' : '') : '') + it.str; if (it.hasEOL){ out.push(line); line = ''; lastY = null; } else lastY = y; });
      if (line) out.push(line);
    }
    return out.map(s => s.replace(/\s+/g, ' ').trim()).filter(Boolean).join('\n');
  }
  if (ext === 'docx'){
    const z = await JSZip.loadAsync(buf); const xml = await z.file('word/document.xml').async('string');
    return xml.split(/<\/w:p>/).map(p => p.replace(/<w:tab\/>/g, '\t').replace(/<w:br[^>]*\/>/g, '\n').replace(/<[^>]+>/g, '')).map(s => s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").trim()).filter(Boolean).join('\n');
  }
  if (ext === 'doc') throw new Error('Old .doc files cannot be read. Open it in Word and "Save As" .docx, or upload the PDF.');
  return new TextDecoder().decode(buf);
}
const SCHEMA = `{"name":"","headline":"","contact":{"email":"","phone":"","location":"","linkedin":"","other":""},"summary":"","skills":[""],"experience":[{"title":"","company":"","location":"","start":"","end":"","bullets":[""]}],"education":[{"degree":"","institution":"","location":"","year":"","details":""}],"certifications":[""],"extra":[{"title":"","items":[""]}]}`;
function parsePrompt(text){
  return `Convert this resume into JSON with exactly this shape:
${SCHEMA}
Rules:
- Copy the wording exactly as written. Do not add, improve, shorten or invent anything.
- "headline" is the professional title line under the name if there is one (else the most recent job title).
- "skills": every skill, tool and competency listed in the resume, one per item.
- "experience": newest first; every bullet or responsibility line of each job as one item.
- Anything that does not fit (languages, projects, awards, personal details) goes into "extra" with its own section title.
- Use "" for missing fields. Reply with JSON only.
RESUME TEXT:
"""${text.slice(0, 30000)}"""`;
}
function normData(d){
  d = d || {}; const c = d.contact || {};
  const arr = x => Array.isArray(x) ? x : (x ? [x] : []);
  return {
    name: String(d.name || '').trim(), headline: String(d.headline || '').trim(),
    contact: {email:c.email || '', phone:c.phone || '', location:c.location || '', linkedin:c.linkedin || '', other:c.other || ''},
    summary: String(d.summary || '').trim(),
    skills: arr(d.skills).map(s => String(s).trim()).filter(Boolean),
    experience: arr(d.experience).map(j => ({title:String(j.title||'').trim(), company:String(j.company||'').trim(), location:String(j.location||'').trim(), start:String(j.start||'').trim(), end:String(j.end||'').trim(), bullets:arr(j.bullets).map(b => String(b).replace(/^[•\-–·*\s]+/, '').trim()).filter(Boolean)})).filter(j => j.title || j.company),
    education: arr(d.education).map(e => ({degree:String(e.degree||'').trim(), institution:String(e.institution||'').trim(), location:String(e.location||'').trim(), year:String(e.year||'').trim(), details:String(e.details||'').trim()})).filter(e => e.degree || e.institution),
    certifications: arr(d.certifications).map(s => String(s).trim()).filter(Boolean),
    extra: arr(d.extra).map(x => ({title:String(x.title||'').trim(), items:arr(x.items).map(s => String(s).trim()).filter(Boolean)})).filter(x => x.title && x.items.length)
  };
}

/* ===================== base resume card ===================== */
function renderBase(){
  const a = $('baseArea'), b = S.base;
  if (!b){

/* ===================== keyword matching & truth checks ===================== */
const STOP = new Set('a an and or the of to in on for with by at as from is are be this that will you your our we their its it into across within per via using use etc able ability strong good excellent experience experienced years year work working including include such other'.split(' '));
const stem = w => w.length > 4 ? w.replace(/(ings|ing|ies|ied|ed|es|s)$/,'') : w;
const toks = s => String(s || '').toLowerCase().replace(/[^a-z0-9+#.&/ -]/g, ' ').replace(/[/&-]/g, ' ').split(/\s+/).map(w => w.replace(/^\.+|\.+$/g, '')).filter(Boolean).map(stem);
function hasTerm(textToks, term){
  const t = toks(term).filter(w => !STOP.has(w)); if (!t.length) return false;
  if (t.length === 1) return textToks.set.has(t[0]) || (t[0].length >= 3 && textToks.arr.some(w => w.startsWith(t[0]) && w.length - t[0].length <= 4));
  const a = textToks.arr;
  for (let i = 0; i <= a.length - t.length; i++){ let ok = true; for (let k = 0; k < t.length; k++){ if (a[i + k] !== t[k]){ ok = false; break; } } if (ok) return true; }
  return t.every(w => textToks.set.has(w)) && t.length <= 3 && nearby(a, t);
}
function nearby(a, t){ // all words appear within a 6-word window
  for (let i = 0; i < a.length; i++){ if (a[i] !== t[0]) continue; const win = new Set(a.slice(Math.max(0, i - 6), i + 7)); if (t.every(w => win.has(w))) return true; } return false; }
const TT = text => { const arr = toks(text).filter(w => !STOP.has(w)); return {arr, set:new Set(arr)}; };
function resumeText(d){ return [d.headline, d.summary, d.skills.join(', '), ...d.experience.flatMap(j => [j.title, j.company, ...j.bullets]), ...d.education.map(e => [e.degree, e.institution, e.details].join(' ')), ...d.certifications, ...d.extra.flatMap(x => [x.title, ...x.items])].join('\n'); }
const nums = s => (String(s).match(/\d[\d,]*(\.\d+)?\s*%?/g) || []).map(n => n.replace(/[,\s]/g, ''));
function localKeywords(jd){ // fallback if the AI gives no keyword list
  const w = String(jd).split(/[\n,;:•()]/).map(s => s.trim()).filter(s => s.split(' ').length <= 4 && s.length > 2);
  const cnt = {}; String(jd).toLowerCase().replace(/[^a-z0-9+# ]/g,' ').split(/\s+/).filter(x => x.length > 3 && !STOP.has(x)).forEach(x => cnt[x] = (cnt[x]||0) + 1);
  return Object.entries(cnt).sort((a,b) => b[1]-a[1]).slice(0, 25).map(([t]) => ({term:t, must:false}));
}
function score(d, K){
  const tt = TT(resumeText(d));
  let tw = 0, hw = 0, mt = 0, mh = 0; const hit = [], miss = [];
  K.forEach(k => { const w = k.must ? 2 : 1, h = hasTerm(tt, k.term); tw += w; if (h){ hw += w; hit.push(k); } else miss.push(k); if (k.must){ mt++; if (h) mh++; } });
  const cov = tw ? hw / tw : 0;
  const st = [d.contact.email, d.contact.phone, d.summary, d.skills.length, d.experience.length && d.experience.every(j => j.bullets.length), d.education.length].filter(Boolean).length / 6;
  return {ats:Math.round(100 * (0.85 * cov + 0.15 * st)), cov, hit, miss, mustCov: mt ? mh / mt : cov};
}

/* ===================== tailoring ===================== */
function tailorPrompt(base, jd, role, company){
  const b = {...base, experience: base.experience.map((j, i) => ({id:'e' + i, ...j}))}; delete b._raw;
  return `You are an expert ATS resume writer and HR recruiter. Tailor the candidate's resume to the job below.

STRICT TRUTH RULES (most important):
- Use ONLY facts that are in the BASE RESUME. Never invent or assume employers, job titles, dates, degrees, certifications, tools, software, skills, industries, team sizes, numbers or achievements.
- Every number in your output must appear in the base resume exactly.
- The professional summary must describe only the candidate's real experience from the base resume. Do not claim years of experience unless the base resume states them. No first person ("I", "my").
- If the job needs something the candidate does not have, leave it out. Do not hint that they have it.

WHAT TO DO:
1. "jd_keywords": the 20 to 30 most important hard skills, tools, qualifications and domain terms in the JOB DESCRIPTION, 1 to 3 words each, written as in the job description. "must": true for required ones.
2. "headline": a short title line. Use the target role title only if the candidate has held the same or a very close role; otherwise use their real title with the most relevant area of expertise.
3. "summary": 3 to 4 sentences, using the job's keywords where the base resume supports them.
4. "skills": up to 18 skills taken from the base resume skills or clearly shown in its experience, most relevant to this job first. Where the job uses a different name for the SAME skill, use the job's name.
5. "experience": for every job id, rewrite its bullets: most relevant first, start with a strong action verb, use the job's keywords only where true, keep every number, keep the meaning. Keep at least 3 bullets for recent jobs and at least 2 for older ones, at most 8.

Reply with JSON only, in this shape:
{"jd_keywords":[{"term":"","must":true}],"headline":"","summary":"","skills":[""],"experience":[{"id":"e0","bullets":[""]}]}

TARGET ROLE: ${role}
COMPANY: ${company}
JOB DESCRIPTION:
"""${jd.slice(0, 15000)}"""

BASE RESUME (JSON):
${JSON.stringify(b)}`;
}
function guard(base, ai, K){
  const baseText = resumeText(base) + '\n' + (base._raw || '');
  const btt = TT(baseText), bnum = new Set(nums(baseText));
  const jdOnly = K.filter(k => !hasTerm(btt, k.term)); // job keywords the candidate does not have
  const fixes = [];
  const numsOK = s => nums(s).every(n => bnum.has(n) || bnum.has(n.replace('%','')));
  const fakeKw = s => { const st = TT(s); return jdOnly.find(k => hasTerm(st, k.term)); };
  const out = JSON.parse(JSON.stringify(base)); delete out._raw;
  // headline
  let hl = String(ai.headline || '').trim();
  if (hl){ const bad = !numsOK(hl) || fakeKw(hl) || toks(hl).filter(w => !STOP.has(w) && w.length > 2).some(w => !btt.set.has(w)); if (bad){ fixes.push('Title line kept from your base resume'); hl = base.headline; } }
  out.headline = hl || base.headline;
  // summary: keep only sentences that pass
  const sents = String(ai.summary || '').split(/(?<=[.!?])\s+/).map(s => s.trim()).filter(Boolean);
  const keep = sents.filter(s => { const k = fakeKw(s); const ok = numsOK(s) && !k && !/\b(I|my|me)\b/.test(s); if (!ok) fixes.push(`Summary sentence removed (${k ? '"' + k.term + '" is not in your base resume' : 'number or wording not in your base resume'})`); return ok; });
  out.summary = keep.length >= 2 ? keep.join(' ') : base.summary;
  if (keep.length < 2 && sents.length) fixes.push('Summary kept from your base resume');
  // skills
  const sk = (Array.isArray(ai.skills) ? ai.skills : []).map(s => String(s).trim()).filter(Boolean);
  const okSk = []; sk.forEach(s => { if (hasTerm(btt, s)) okSk.push(s); else fixes.push(`Skill "${s}" removed (not in your base resume)`); });
  base.skills.forEach(s => { if (okSk.length < 18 && !okSk.some(x => x.toLowerCase() === s.toLowerCase())) okSk.push(s); });
  out.skills = okSk.slice(0, 18);
  // experience: titles, companies and dates always from the base
  const byId = {}; (ai.experience || []).forEach(e => { if (e && e.id) byId[e.id] = e; });
  out.experience = base.experience.map((j, i) => {
    const e = byId['e' + i]; const bl = (e && Array.isArray(e.bullets) ? e.bullets : []).map(s => String(s).replace(/^[•\-–·*\s]+/, '').trim()).filter(Boolean);
    const good = bl.filter(s => { const k = fakeKw(s); const ok = numsOK(s) && !k; if (!ok) fixes.push(`A bullet at ${j.company || j.title} was removed (${k ? '"' + k.term + '" is not in your base resume' : 'a number not in your base resume'})`); return ok; });
    return {...j, bullets: good.length ? good.slice(0, 8) : j.bullets};
  });
  return {data:out, fixes};
}
async function generate(){

  if (jd.length < 120) return say('Paste the full job description (it looks too short).', 'bad');

  const ct = contactLine(d); if (ct.length){ doc.setTextColor(60); text(ct.join('  |  '), 9.2, 'normal', L, W, 4.4); doc.setTextColor(20); }

      const co = [j.company, j.location].filter(Boolean).join(', '); if (co) text(co, 10, 'italic', L, W, 4.6);
      j.bullets.forEach(b => { doc.setFont('helvetica', 'normal'); doc.setFontSize(10); const ls = doc.splitTextToSize(b, W - 5); need(4.6 * Math.min(ls.length, 2)); doc.text('•', L + 1, y); ls.forEach(l => { need(4.6); doc.text(l, L + 5, y); y += 4.6; }); y += 0.4; });
    }); }

const xe = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
async function buildDOCX(d){
  const run = (t, o={}) => `<w:r><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>${o.b ? '<w:b/>' : ''}${o.i ? '<w:i/>' : ''}${o.color ? `<w:color w:val="${o.color}"/>` : ''}<w:sz w:val="${o.sz || 21}"/><w:szCs w:val="${o.sz || 21}"/></w:rPr><w:t xml:space="preserve">${xe(t)}</w:t></w:r>`;
  const tab = '<w:r><w:tab/></w:r>';
  const p = (inner, o={}) => `<w:p><w:pPr>${o.keep ? '<w:keepNext/>' : ''}${o.tabs ? '<w:tabs><w:tab w:val="right" w:pos="10204"/></w:tabs>' : ''}${o.border ? '<w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="9AA3AD"/></w:pBdr>' : ''}${o.ind ? '<w:ind w:left="284" w:hanging="284"/>' : ''}<w:spacing w:before="${o.before || 0}" w:after="${o.after == null ? 40 : o.after}"/></w:pPr>${inner}</w:p>`;
  let b = '';
  b += p(run(d.name, {b:1, sz:38}), {after:20});
  if (d.headline) b += p(run(d.headline, {b:1, sz:23}), {after:20});
  const ct = contactLine(d); if (ct.length) b += p(run(ct.join('  |  '), {sz:19, color:'404040'}), {after:80});
  const H = t => p(run(t.toUpperCase(), {b:1, sz:22}), {border:1, before:160, after:60, keep:1});
  const bullet = t => p(run('•') + tab + run(t), {ind:1, after:20});
  if (d.summary){ b += H('Professional Summary') + p(run(d.summary)); }
  if (d.skills.length){ b += H('Core Skills') + p(run(d.skills.join('  •  '))); }
  if (d.experience.length){ b += H('Professional Experience');
    d.experience.forEach((j, i) => { b += p(run(j.title, {b:1}) + (dates(j) ? tab + run(dates(j), {b:1}) : ''), {tabs:1, before:i ? 100 : 0, after:0, keep:1});
      const co = [j.company, j.location].filter(Boolean).join(', '); if (co) b += p(run(co, {i:1}), {after:30, keep:1});
      j.bullets.forEach(x => b += bullet(x)); }); }
  if (d.education.length){ b += H('Education'); d.education.forEach(e => { b += p(run(e.degree, {b:1}) + run([e.institution, e.location].filter(Boolean).map(x => ', ' + x).join('') + (e.year ? ' — ' + e.year : ''))); if (e.details) b += p(run(e.details, {sz:20})); }); }
  if (d.certifications.length){ b += H('Certifications'); d.certifications.forEach(x => b += bullet(x)); }
  d.extra.forEach(x => { b += H(x.title); x.items.forEach(i => b += bullet(i)); });
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${b}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="851" w:right="851" w:bottom="851" w:left="851" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const z = new JSZip();
  z.file('[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>');
  z.file('_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>');
  z.file('docProps/core.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>${xe(d.name)} – Resume</dc:title><dc:creator>${xe(d.name)}</dc:creator><dc:subject>${xe(S.out.role + ' – ' + S.out.company)}</dc:subject></cp:coreProperties>`);
  z.file('word/document.xml', doc);
  return z.generateAsync({type:'blob', compression:'DEFLATE', compressionOptions:{level:9}, mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

/* ===================== events ===================== */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return; const a = el.dataset.act;
  if (a === 'ai-open'){ S.ai.open = true; renderAI(); $('aiBox').scrollIntoView({behavior:'smooth'}); }
  else if (a === 'ai-close'){ S.ai.open = false; renderAI(); }
  else if (a === 'g-save'){ S.ai.gKey = $('gKey').value.trim(); S.ai.gModel = $('gModel').value.trim() || 'gemini-2.5-flash'; lsSet(LS.gkey, S.ai.gKey); lsSet(LS.gmodel, S.ai.gModel); S.ai.prov = 'gemini'; lsSet(LS.prov, 'gemini'); S.ai.status = S.ai.gKey ? 'Key saved.' : ''; renderAI(); }
  else if (a === 'g-remove'){ S.ai.gKey = ''; lsSet(LS.gkey, ''); S.ai.status = 'Key removed.'; renderAI(); }
  else if (a === 'upload'){ $('fileIn').click(); }
  else if (a === 'paste'){ openPaste(); }
  else if (a === 'paste-go'){ const t = $('pasteText').value; $('ovl').innerHTML = ''; importBase(async () => t); }
  else if (a === 'edit'){ openEditor(S.base.data, false); }
  else if (a === 'job-add'){ readEditor(); ED.experience.unshift({title:'', company:'', location:'', start:'', end:'', bullets:[]}); drawEditor(); }
  else if (a === 'job-del'){ readEditor(); ED.experience.splice(+el.dataset.i, 1); drawEditor(); }
  else if (a === 'ed-cancel'){ $('ovl').innerHTML = ''; ED = null; }
  else if (a === 'ed-save'){ readEditor(); const raw = ED._raw; const d = normData(ED); if (raw) d._raw = raw; if (!d.name) return toast('Please enter your name.'); if (!d.experience.length) return toast('Please keep at least one job.'); $('ovl').innerHTML = ''; ED = null; saveBase(d); }
  else if (a === 'generate'){ generate(); }
  else if (a === 'fixes'){ const f = $('fixList'); f.hidden = !f.hidden; }
  else if (a === 'dl-pdf'){ try { const bl = buildPDF(S.out.data); if (bl.size >= MAXB) return toast('The PDF is over 1 MB. Shorten the resume and try again.'); await saveFile(fileBase() + '.pdf', bl); } catch(err){ toast('PDF could not be made: ' + err.message); } }
  else if (a === 'dl-docx'){ try { const bl = await buildDOCX(S.out.data); if (bl.size >= MAXB) return toast('The Word file is over 1 MB. Shorten the resume and try again.'); await saveFile(fileBase() + '.docx', bl); } catch(err){ toast('Word file could not be made: ' + err.message); } }
});
